<script>
const BLOCKS = {
  "col-1": {title:"collections · крок 1 (namedtuple — кортеж з іменами)", items:[
    {type:"note", text:`<b>📊 Розширюємо арсенал колекцій.</b> Звичайний кортеж змушує памʼятати порядок: <code>person[0]</code> — це імʼя чи вік? <b>Іменований кортеж</b> <code>namedtuple</code> дає полям імена, і код стає зрозумілим: <code>person.name</code>. При цьому доступ за індексом теж лишається.`},
    {type:"run",
     prompt:`Описуємо структуру <code>Student</code> з полями — і звертаємось до неї і за іменем, і за індексом. Запустіть.`,
     code:'from collections import namedtuple\n\n# опис структури: поля name, group, avg\nStudent = namedtuple("Student", ["name", "group", "avg"])\n\ns = Student("Мік", "PD-11", 8.5)\nprint("За іменем:", s.name, s.avg)\nprint("За індексом:", s[0], s[2])\n'},
    {type:"task",
     prompt:`Виведіть <b>середній бал</b> за іменем поля. Допишіть рядок <code>print(s.avg)</code>. Має вийти <code>9.5</code>.`,
     starter:'from collections import namedtuple\n\nStudent = namedtuple("Student", ["name", "group", "avg"])\ns = Student("Аня", "PD-11", 9.5)\n# допишіть рядок, що виведе середній бал за іменем поля\n',
     expected:"9.5"}
  ]},

  "col-2": {title:"collections · крок 2 (Counter — підрахунок)", items:[
    {type:"note", text:`<b>Counter</b> — це словник, що сам рахує, скільки разів трапляється кожен елемент. Замість циклу з перевірками — один рядок. Передайте йому будь-що ітероване (список, рядок), а метод <code>most_common(n)</code> покаже <code>n</code> найчастіших.`},
    {type:"run",
     prompt:`Рахуємо оцінки одним рядком і дивимось топ-2. Запустіть.`,
     code:'from collections import Counter\n\nmarks = [4, 2, 4, 6, 7, 4, 2, 3, 4, 5, 6, 6, 7, 1, 1, 1, 3, 5]\ncounts = Counter(marks)\nprint(counts)\nprint("Топ-2:", counts.most_common(2))\n'},
    {type:"task",
     prompt:`Порахуйте літери у слові й виведіть, скільки разів трапляється <code>"a"</code>. Допишіть рядок <code>print(c["a"])</code>. Для <code>"banana"</code> має вийти <code>3</code>.`,
     starter:'from collections import Counter\n\nc = Counter("banana")\n# допишіть рядок, що виведе, скільки разів трапляється літера a\n',
     expected:"3"}
  ]},

  "col-3": {title:"collections · крок 3 (defaultdict — без KeyError)", items:[
    {type:"note", text:`<b>defaultdict</b> — словник, що сам створює значення для нового ключа. У звичайному словнику звернення до відсутнього ключа дає <code>KeyError</code>; тут же ключ зʼявляється автоматично зі значенням фабрики: <code>defaultdict(list)</code> → порожній список, <code>defaultdict(int)</code> → <code>0</code>. Зручно для групування без ручних перевірок «а чи є вже такий ключ».`},
    {type:"run",
     prompt:`Групуємо слова за першою літерою — без жодної перевірки «чи існує ключ». Запустіть.`,
     code:'from collections import defaultdict\n\nwords = ["apple", "zoo", "lion", "lama", "bear", "appendix"]\ngrouped = defaultdict(list)\nfor w in words:\n    grouped[w[0]].append(w)\n\nprint(dict(grouped))\n'},
    {type:"task",
     prompt:`Скільки слів на літеру <code>"a"</code>? Допишіть рядок <code>print(len(grouped["a"]))</code>. Має вийти <code>3</code>.`,
     starter:'from collections import defaultdict\n\nwords = ["apple", "avocado", "banana", "cherry", "apricot"]\ngrouped = defaultdict(list)\nfor w in words:\n    grouped[w[0]].append(w)\n# допишіть рядок, що виведе, скільки слів на літеру a\n',
     expected:"3"}
  ]},

  "ds-1": {title:"Структури даних · крок 1 (стек, LIFO)", items:[
    {type:"note", text:`<b>🥞 Стек</b> працює за принципом <b>LIFO</b> — «останнім прийшов, першим вийшов» (як стопка тарілок). У Python його зручно робити звичайним списком: <code>append()</code> кладе нагору, <code>pop()</code> знімає верхній, <code>stack[-1]</code> підглядає верхній не знімаючи.`},
    {type:"run",
     prompt:`Кладемо три елементи, дивимось верхній і знімаємо його. Запустіть.`,
     code:'stack = []\nstack.append("a")\nstack.append("b")\nstack.append("c")\nprint("Стек:", stack)\nprint("Верхній (peek):", stack[-1])\nprint("Знято (pop):", stack.pop())\nprint("Лишилось:", stack)\n'},
    {type:"mcq", q:`Стек — це LIFO. Додали <code>a</code>, <code>b</code>, <code>c</code>. Який елемент вийде першим при <code>pop()</code>?`,
     opts:["c","a","b"], answer:"c",
     expl:`LIFO — Last In, First Out: останній доданий (<code>c</code>) виходить першим.`},
    {type:"task",
     prompt:`Зніміть верхній елемент і виведіть його. Допишіть рядок <code>print(stack.pop())</code>. Має вийти <code>c</code>.`,
     starter:'stack = []\nstack.append("a")\nstack.append("b")\nstack.append("c")\n# допишіть рядок, що зніме верхній елемент і виведе його\n',
     expected:"c"}
  ]},

  "ds-2": {title:"Структури даних · крок 2 (черга, FIFO через deque)", items:[
    {type:"note", text:`<b>Черга</b> працює за принципом <b>FIFO</b> — «першим прийшов, першим вийшов» (як черга в магазині). Її роблять через <code>deque</code> з <code>collections</code>: <code>append()</code> додає в кінець, <code>popleft()</code> бере з початку. Чому не звичайний список? Бо видалення з початку списку змушує Python зсунути всі елементи (повільно), а <code>deque</code> робить це миттєво.`},
    {type:"run",
     prompt:`Додаємо трьох у чергу — і першим виходить той, хто прийшов першим. Запустіть.`,
     code:'from collections import deque\n\nqueue = deque()\nqueue.append("a")\nqueue.append("b")\nqueue.append("c")\nprint("Черга:", list(queue))\nprint("Вийшов першим:", queue.popleft())\nprint("Лишилось:", list(queue))\n'},
    {type:"mcq", q:`Чому для черги (FIFO) краще <code>deque</code>, а не звичайний список?`,
     opts:["Видалення з початку в deque швидке (O(1)), а у списку — повільне","deque завжди займає менше памʼяті, ніж звичайний список","Звичайний список взагалі не має методу для додавання"], answer:"Видалення з початку в deque швидке (O(1)), а у списку — повільне",
     expl:`У списку видалення з початку змушує зсувати всі наступні елементи. <code>deque</code> оптимізований для швидких операцій з обох кінців.`},
    {type:"task",
     prompt:`Візьміть перший елемент черги й виведіть його. Допишіть рядок <code>print(queue.popleft())</code>. Має вийти <code>a</code>.`,
     starter:'from collections import deque\n\nqueue = deque(["a", "b", "c"])\n# допишіть рядок, що візьме перший елемент черги і виведе його\n',
     expected:"a"}
  ]},

  "ds-3": {title:"Структури даних · крок 3 (двостороння deque + фінал)", items:[
    {type:"note", text:`<b>Двостороння черга (deque)</b> дозволяє додавати й знімати з <b>обох</b> кінців: <code>append</code>/<code>pop</code> — справа, <code>appendleft</code>/<code>popleft</code> — зліва. А параметр <code>maxlen</code> робить «вікно» фіксованого розміру: нові елементи витісняють найстаріші.`},
    {type:"run",
     prompt:`<code>deque(maxlen=3)</code> тримає лише 3 останні — старі витісняються. Запустіть і подивіться, як «їде вікно».`,
     code:'from collections import deque\n\nd = deque(maxlen=3)\nfor i in range(6):\n    d.append(i)\n    print(list(d))\n'},
    {type:"note", text:`<b>Фінал — черга завдань за пріоритетом.</b> Швидкі завдання додаємо на початок (<code>appendleft</code>), повільні — у кінець (<code>append</code>). Виконуємо з початку — тож швидкі йдуть першими.<br><br>🔗 <b>У фінальному проєкті</b> черги й спеціальні колекції стануть у пригоді для обробки завдань і даних у потрібному порядку.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — швидкі завдання виконаються раніше за повільні. Додайте своє завдання в список і запустіть ще раз. 🥞`,
     code:'from collections import deque\n\ntasks = [\n    {"type": "fast", "name": "Помити посуд"},\n    {"type": "slow", "name": "Подивитись серіал"},\n    {"type": "fast", "name": "Вигуляти собаку"},\n]\nq = deque()\nfor t in tasks:\n    if t["type"] == "fast":\n        q.appendleft(t)\n    else:\n        q.append(t)\n\nwhile q:\n    t = q.popleft()\n    print("Виконується:", t["name"])\n'}
  ]},

  "dec-1": {title:"decimal · крок 1 (проблема точності float)", items:[
    {type:"note", text:`<b>🎯 Чому <code>0.1 + 0.2</code> не дорівнює <code>0.3</code>?</b> Компʼютер зберігає дробові числа у двійковій системі, і деякі з них — неточно. Звідси крихітна похибка. Для грошей і точних розрахунків це неприпустимо — там використовують <code>Decimal</code> з модуля <code>decimal</code>.`},
    {type:"run",
     prompt:`Спершу переконаймось у похибці <code>float</code>. Запустіть.`,
     code:'print("0.1 + 0.2 == 0.3 ?", 0.1 + 0.2 == 0.3)\nprint("0.1 + 0.2 =", 0.1 + 0.2)\n'},
    {type:"run",

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+

    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");

    out.textContent=""; let py;

    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}

    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 7 — collections, структури даних, decimal і генератори",
  intro:`Тут ви розширюєте інструментарій Python: спеціальні колекції з модуля <code>collections</code> (<code>namedtuple</code>, <code>Counter</code>, <code>defaultdict</code>), класичні структури даних (стек, черга, двостороння <code>deque</code>), точні обчислення з <code>decimal</code> і <b>генератори</b> для лінивої обробки даних. Майже все запускається прямо тут — пробуйте руками.`,
  groups:[
    {name:"📊 collections — спеціальні колекції", desc:`<code>namedtuple</code> (кортеж з іменами полів), <code>Counter</code> (підрахунок елементів) і <code>defaultdict</code> (словник без <code>KeyError</code>) — на прикладі аналізу оцінок і тексту.`, blocks:["col-1","col-2","col-3"]},
    {name:"🥞 Структури даних", desc:`Стек (<b>LIFO</b>), черга (<b>FIFO</b>) через <code>deque</code> і двостороння черга з <code>maxlen</code>. У фіналі — черга завдань за пріоритетом.`, blocks:["ds-1","ds-2","ds-3"]},
    {name:"🎯 decimal — точні обчислення", desc:`Чому <code>0.1 + 0.2 ≠ 0.3</code> у <code>float</code>, як <code>Decimal</code> це виправляє, і як керувати точністю та округленням (<code>getcontext</code>, <code>quantize</code>).`, blocks:["dec-1","dec-2"]},
    {name:"🌀 Генератори", desc:`<code>yield</code> замість <code>return</code>, <code>next()</code> і цикл <code>for</code>, <code>StopIteration</code> та ліниве читання великих даних без завантаження в памʼять.`, blocks:["gen-1","gen-2"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки з колекціями, decimal і генераторами та короткі ідіоми. Необовʼязково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
