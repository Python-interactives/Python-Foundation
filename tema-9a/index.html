    <h1 id="title">🐍 Python · Тема 9a — інтерактиви</h1>
  </header>
  <div id="app"></div>

<nav class="botnav" style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:30px;padding-top:20px;border-top:1px solid var(--border)">

  <div style="justify-self:end"></div>

<script>
const BLOCKS = {
  "oop-1": {title:"Клас, поля й методи · крок 1 (перший клас)", items:[
    {type:"note", text:`<b>🏗 Клас</b> — це «форма для випічки»: він описує, які <b>поля</b> (дані) і <b>методи</b> (дії) матиме обʼєкт. <b>Обʼєкт</b> — конкретне «печиво» за цією формою. Метод-конструктор <code>__init__</code> викликається при створенні обʼєкта й задає його поля через <code>self</code> (перший параметр будь-якого методу — сам обʼєкт).`},
    {type:"run",
     prompt:`Клас <code>Person</code> з конструктором і двома методами. Запустіть.`,
     code:'class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def say_name(self):\n        print(f"Привіт! Я {self.name}, мені {self.age}.")\n\n    def set_age(self, age):\n        self.age = age\n\nbob = Person("Boris", 34)\nbob.say_name()\nbob.set_age(25)\nbob.say_name()\n'},
    {type:"task",
     prompt:`Створіть обʼєкт і викличте метод. Допишіть рядок <code>p.say_name()</code>. Має вийти <code>Мене звати Аня</code>.`,
     starter:'class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def say_name(self):\n        print(f"Мене звати {self.name}")\n\np = Person("Аня", 20)\n# викличте метод, що виведе імʼя\n',
     expected:"Мене звати Аня"}
  ]},

  "oop-2": {title:"Клас, поля й методи · крок 2 (атрибут класу vs поле)", items:[
    {type:"note", text:`<b>Атрибут класу</b> — спільна змінна для всіх обʼєктів (оголошена в тілі класу). <b>Поле обʼєкта</b> — своя копія в кожному обʼєкті (задається через <code>self</code> у <code>__init__</code>). До атрибута класу звертаються як <code>Клас.attr</code>, до поля — як <code>self.field</code>.`},
    {type:"run",
     prompt:`<code>count</code> — атрибут класу (спільний), <code>name</code> — поле обʼєкта. Запустіть.`,
     code:'class Person:\n    count = 0\n\n    def __init__(self, name):\n        self.name = name\n        Person.count += 1\n\n    def how_many(self):\n        print("Людей зараз:", Person.count)\n\nfirst = Person("Boris")\nfirst.how_many()\nsecond = Person("Alex")\nfirst.how_many()\n'},
    {type:"mcq", code:"class Person:\n    count = 0\n    def __init__(self):\n        self.count = 10\n\np = Person()\nprint(p.count, Person.count)", opts:["10 0","10 10","0 0"], answer:"10 0",
     expl:`<code>p.count</code> — це поле обʼєкта (10), яке перекрило однойменний атрибут класу при читанні через обʼєкт. А <code>Person.count</code> — атрибут класу (0), він не змінився.`},
    {type:"task",
     prompt:`Атрибут класу рахує створені обʼєкти. Скільки котів створено? Допишіть рядок <code>print(Cat.count)</code>. Має вийти <code>2</code>.`,
     starter:'class Cat:\n    count = 0\n    def __init__(self, name):\n        self.name = name\n        Cat.count += 1\n\na = Cat("Мурчик")\nb = Cat("Барсик")\n# скільки котів створено?\n',
     expected:"2"}
  ]},

  "enc-1": {title:"Інкапсуляція · крок 1 (public / protected / private)", items:[
    {type:"note", text:`<b>🔒 Інкапсуляція</b> — приховування деталей класу. У Python рівні позначають іменем: звичайне імʼя — <b>public</b> (доступне всюди); одне підкреслення <code>_x</code> — <b>protected</b> (конвенція «не чіпати ззовні»); два підкреслення <code>__x</code> — <b>private</b> (спрацьовує <i>name mangling</i> — імʼя перейменовується на <code>_Клас__x</code>). Справжньої приватності, як у Java, немає — усе базується на дисципліні.`},
    {type:"run",
     prompt:`Три рівні доступу; приватне поле дістаємо лише через змінене імʼя. Запустіть.`,
     code:'class Person:\n    def __init__(self, name, is_admin):\n        self.name = name\n        self._role = "user"\n        self.__is_admin = is_admin\n\np = Person("Boris", False)\nprint(p.name)\nprint(p._role)\nprint(p._Person__is_admin)\n'},
    {type:"mcq", q:`Що робить префікс <code>__</code> (два підкреслення) перед іменем атрибута?`,
     opts:["Змінює імʼя (name mangling) — ззовні напряму вже не дістати","Робить атрибут по-справжньому приватним, як у Java","Нічого, це просто стиль"], answer:"Змінює імʼя (name mangling) — ззовні напряму вже не дістати",
     expl:`Python перейменовує <code>__is_admin</code> на <code>_Person__is_admin</code>. Це ускладнює випадковий доступ, але справжньої приватності немає — через змінене імʼя поле все одно доступне.`}
  ]},

  "enc-2": {title:"Інкапсуляція · крок 2 (гетери й сетери)", items:[
    {type:"note", text:`Правильний підхід — не чіпати приховані поля напряму, а працювати через <b>публічні методи</b>: гетер (прочитати) і сетер (змінити, з можливою перевіркою). Так клас контролює свої дані.`},
    {type:"run",
     prompt:`Доступ до приватного поля лише через методи <code>get_/set_</code>. Запустіть.`,
     code:'class Person:\n    def __init__(self, is_admin):\n        self.__is_admin = is_admin\n\n    def get_is_admin(self):\n        return self.__is_admin\n\n    def set_is_admin(self, value):\n        self.__is_admin = value\n\np = Person(False)\nprint(p.get_is_admin())\np.set_is_admin(True)\nprint(p.get_is_admin())\n'},
    {type:"task",
     prompt:`Отримайте баланс через метод-гетер. Допишіть рядок <code>print(acc.get_balance())</code>. Має вийти <code>100</code>.`,
     starter:'class Account:\n    def __init__(self, balance):\n        self.__balance = balance\n\n    def get_balance(self):\n        return self.__balance\n\nacc = Account(100)\n# отримайте баланс через метод\n',
     expected:"100"}
  ]},

  "inh-1": {title:"Наслідування · крок 1 (базовий і похідний клас)", items:[
    {type:"note", text:`<b>🧬 Наслідування</b> дозволяє одному класу перейняти поля й методи іншого. <b>Базовий</b> (батьківський) клас задає спільне, <b>похідні</b> класи його наслідують і можуть <b>перевизначати</b> методи. Тут <code>Cat</code>, <code>Dog</code>, <code>Cow</code> наслідують <code>Animal</code>, але кожен по-своєму реалізує <code>make_sound</code>.`},
    {type:"run",
     prompt:`Три похідні класи перевизначають <code>make_sound</code>. Запустіть.`,
     code:'class Animal:\n    def __init__(self, nickname, age):\n        self.nickname = nickname\n        self.age = age\n\n    def make_sound(self):\n        pass\n\nclass Cat(Animal):\n    def make_sound(self):\n        return "Meow"\n\nclass Dog(Animal):\n    def make_sound(self):\n        return "Woof"\n\nprint(Cat("Simon", 4).make_sound())\nprint(Dog("Rex", 5).make_sound())\n'},
    {type:"task",
     prompt:`Клас <code>Cow</code> наслідує <code>Animal</code>. Виведіть звук корови — допишіть рядок <code>print(c.make_sound())</code>. Має вийти <code>Moo</code>.`,
     starter:'class Animal:\n    def __init__(self, nickname):\n        self.nickname = nickname\n    def make_sound(self):\n        pass\n\nclass Cow(Animal):\n    def make_sound(self):\n        return "Moo"\n\nc = Cow("Bessie")\n# виведіть звук корови\n',
     expected:"Moo"}
  ]},

  "inh-2": {title:"Наслідування · крок 2 (super)", items:[
    {type:"note", text:`Якщо похідний клас має власний <code>__init__</code>, викликом <code>super().__init__(...)</code> запускають конструктор <b>базового</b> класу — щоб не переписувати спільне, а лише додати нове. Тут <code>Dog</code> бере <code>nickname</code>/<code>age</code> від <code>Animal</code> і додає власне поле <code>breed</code> та метод <code>chase_tail</code>.`},
    {type:"run",
     prompt:`<code>super()</code> викликає конструктор <code>Animal</code>, а далі додаємо своє. Запустіть.`,
     code:'class Animal:\n    def __init__(self, nickname, age):\n        self.nickname = nickname\n        self.age = age\n    def make_sound(self):\n        pass\n\nclass Dog(Animal):\n    def __init__(self, nickname, age, breed):\n        super().__init__(nickname, age)\n        self.breed = breed\n    def make_sound(self):\n        return "Woof"\n    def chase_tail(self):\n        return f"{self.nickname} ганяється за хвостом!"\n\nd = Dog("Rex", 5, "Golden")\nprint(d.make_sound())\nprint(d.chase_tail())\nprint("Вік:", d.age)\n'},
    {type:"task",
     prompt:`<code>Cat</code> через <code>super()</code> успадкував <code>nickname</code>. Виведіть імʼя кота — допишіть рядок <code>print(c.nickname)</code>. Має вийти <code>Simon</code>.`,
     starter:'class Animal:\n    def __init__(self, nickname):\n        self.nickname = nickname\n\nclass Cat(Animal):\n    def __init__(self, nickname, color):\n        super().__init__(nickname)\n        self.color = color\n\nc = Cat("Simon", "сірий")\n# виведіть імʼя кота (успадковане через super)\n',
     expected:"Simon"}
  ]},

  "mro-1": {title:"Багаторівневе наслідування та MRO", items:[
    {type:"note", text:`<b>🪜 Багаторівневе наслідування</b> — ланцюжок класів (напр. <code>TalkingParrot → Parrot → Bird → Animal</code>). Коли класів-батьків кілька, порядок пошуку методів/атрибутів визначає <b>MRO</b> (Method Resolution Order): спершу сам клас, потім батьки зліва направо, далі їхні батьки. Побачити порядок: <code>Клас.mro()</code>.`},
    {type:"run",
     prompt:`Порядок пошуку для <code>D(B, C)</code>. Запустіть.`,
     code:'class A:\n    pass\nclass B(A):\n    pass\nclass C(A):\n    pass\nclass D(B, C):\n    pass\n\nfor cls in D.mro():\n    print(cls.__name__)\n'},
    {type:"mcq", code:"class A:\n    name = \"Я A\"\nclass B:\n    name = \"Я B\"\nclass C(A, B):\n    pass\n\nprint(C().name)", opts:["Я A","Я B","помилка"], answer:"Я A",

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

    {name:"🔒 Інкапсуляція", desc:`Рівні доступу: <b>public</b>, <b>_protected</b>, <b>__private</b> (name mangling) — і правильний доступ через гетери/сетери.`, blocks:["enc-1","enc-2"]},
    {name:"🧬 Наслідування", desc:`Базовий і похідний класи, перевизначення методів і <code>super()</code> для виклику конструктора батька.`, blocks:["inh-1","inh-2"]},
    {name:"🪜 Багаторівневе наслідування та MRO", desc:`Ланцюжок класів і порядок пошуку атрибутів (<code>mro()</code>) — звідки береться метод, коли батьків кілька.`, blocks:["mro-1"]},
    {name:"🦆 Поліморфізм і качина типізація", desc:`Спільний інтерфейс для різних класів і duck typing — важлива наявність методу, а не тип.`, blocks:["poly-1"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки ООП (<code>self</code>, спільні атрибути класу, MRO, <code>super</code>) та ідіоми. Необовʼязково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">🔒 Код виконується у вашому браузері — нічого не надсилається. Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
</script>
<script>
(function(){
  var f=document.querySelector(".snakeprog .fill"); if(!f) return;
  var h=document.documentElement;
  function upd(){
    var se=h.scrollHeight-h.clientHeight;
    var p=se>0?(h.scrollTop||document.body.scrollTop)/se:0;
    if(p<0)p=0; if(p>1)p=1;
    f.style.width=(p*100).toFixed(2)+"%";
  }
  addEventListener("scroll",upd,{passive:true});
  addEventListener("resize",upd);
  setTimeout(upd,60); setTimeout(upd,700); upd();
})();
</script>
<script>(function(){var b=document.getElementById("themeToggle"),r=document.documentElement;if(b)b.addEventListener("click",function(){var n=r.getAttribute("data-theme")==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("pf-theme",n);}catch(e){}});})();</script>
