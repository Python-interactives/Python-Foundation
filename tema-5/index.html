<style>
  :root, [data-theme="light"]{
    --bg:#FFFFFF;--panel:#F6F7F9;--panel2:#ECEEF1;--border:#E4E5EA;
    --white:#1F2430;--muted:#7C828F;--accent:#F2661F;--accent-ink:#D1550F;

  [data-theme="dark"]{
    --bg:#171A22;--panel:#1E222C;--panel2:#262B38;--border:#2B303C;
    --white:#E7EAF1;--muted:#828A99;--accent:#FF7D45;--accent-ink:#FF9160;
    --green:#3FB950;--greenbg:#123420;--red:#f85149;--redbg:#3a1414;
    --blue:#FF7D45;--bluebg:#3a2418;--violet:#b9a4ff;--violetbg:#241d40;

  *{box-sizing:border-box}

  textarea{width:100%;min-height:120px;background:#0F141A;color:#D3DAE4;border:1px solid #23262e;border-radius:8px;padding:12px;font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-size:14px;resize:vertical}
  .out{margin-top:12px;font-size:13px;white-space:pre-wrap;font-family:"JetBrains Mono","SF Mono",Consolas,monospace}
  .out:not(:empty){background:#0F141A;color:#D3DAE4;padding:12px 14px;border-radius:8px;border:1px solid #23262e}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}

  .btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}

  .themetoggle:hover{border-color:var(--accent);color:var(--accent-ink)} [data-theme="dark"] .themetoggle:hover{color:var(--accent)}

  .themetoggle .l-dark{display:none}
  [data-theme="dark"] .themetoggle .l-light{display:none}
  [data-theme="dark"] .themetoggle .l-dark{display:inline}

<script>
const BLOCKS = {
  "file-1": {title:"Щоденник у файлі · крок 1 (запис і читання)", items:[
    {type:"note", text:`<b>📄 Ведемо щоденник у файлі.</b> Коли програма закривається, змінні зникають — а файл лишається. <code>with open(шлях, режим)</code> безпечно відкриває файл і сам закриває його в кінці. Режим <code>"w"</code> — запис, <code>"r"</code> — читання. (Файли тут віртуальні, живуть під час запуску.)<br><br><details style="margin-top:4px"><summary style="cursor:pointer;font-weight:600">⚠️ Про кодування (на майбутнє)</summary><div style="margin-top:8px;line-height:1.6">Тут <code>open()</code> без <code>encoding</code> покладається на дефолт. У цій пісочниці це UTF-8, але на реальній машині (особливо Windows) дефолт може бути іншим — і кирилиця «попливе». Тому в справжньому коді краще завжди вказувати явно: <code>open(файл, encoding="utf-8")</code>.</div></details>`},
    {type:"run",
     prompt:`Запишемо запис у файл і одразу прочитаємо його назад. Запустіть.`,
     code:'with open("diary.txt", "w") as f:\n    f.write("Сьогодні почав вчити Python")\nwith open("diary.txt", "r") as f:\n    print(f.read())\n'},
    {type:"task",
     prompt:`Запишіть свій запис і прочитайте його. У коді нижче замість <code>______</code> впишіть <code>f.write("Мій перший запис")</code>. Очікуваний вивід: <code>Мій перший запис</code>.`,
     starter:'with open("diary.txt", "w") as f:\n    ______\nwith open("diary.txt", "r") as f:\n    print(f.read())\n',
     expected:"Мій перший запис"}
  ]},

  "file-2": {title:"Щоденник у файлі · крок 2 (кілька рядків)", items:[
    {type:"note", text:`<b>З теми.</b> У файлі може бути кілька рядків, розділених символом переносу <code>\\n</code>. <code>readlines()</code> читає їх у список, але лишає <code>\\n</code> в кінці кожного — тож його прибирають <code>strip()</code>.`},
    {type:"run",
     prompt:`Запишемо три рядки й прочитаємо їх у список (уже без <code>\\n</code>). Запустіть.`,
     code:'with open("diary.txt", "w") as f:\n    f.write("рядок1\\nрядок2\\nрядок3")\nwith open("diary.txt", "r") as f:\n    lines = [line.strip() for line in f.readlines()]\nprint(lines)\n'},
    {type:"task",
     prompt:`Скільки рядків у файлі? Допишіть рядок <code>print(len(lines))</code>. Має вийти <code>3</code>.`,
     starter:'with open("diary.txt", "w") as f:\n    f.write("рядок1\\nрядок2\\nрядок3")\nwith open("diary.txt", "r") as f:\n    lines = [line.strip() for line in f.readlines()]\n# допишіть рядок, що виведе, скільки рядків у файлі\n',
     expected:"3"}
  ]},

  "file-3": {title:"Щоденник у файлі · крок 3 (дописати в кінець)", items:[
    {type:"note", text:`<b>З теми.</b> Режим <code>"w"</code> <b>перезаписує</b> файл (стирає старе), а режим <code>"a"</code> (append) <b>дописує</b> в кінець, зберігаючи наявне.`},
    {type:"run",
     prompt:`Спершу записуємо один рядок, потім дописуємо другий режимом <code>"a"</code>. Запустіть — у файлі опиняться обидва.`,
     code:'with open("diary.txt", "w") as f:\n    f.write("перший запис\\n")\nwith open("diary.txt", "a") as f:\n    f.write("другий запис\\n")\nwith open("diary.txt", "r") as f:\n    print(f.read())\n'},
    {type:"task",
     prompt:`Зробіть так, щоб другий запис <b>дописався</b>, а не стер перший. Замість <code>______</code> впишіть режим додавання <code>"a"</code>. Мають лишитися обидва записи.`,
     starter:'with open("diary.txt", "w") as f:\n    f.write("перший запис\\n")\nwith open("diary.txt", ______) as f:\n    f.write("другий запис\\n")\nwith open("diary.txt", "r") as f:\n    print(f.read())\n',
     expected:"перший запис\nдругий запис"}
  ]},

  "file-final": {title:"Щоденник у файлі · фінал", items:[
    {type:"note", text:`<b>Міні-щоденник.</b> Записуємо кілька днів, дописуємо ще один, читаємо всі записи й рахуємо їх — усе разом.<br><br>🔗 <b>У фінальному проєкті</b> ви так само зберігатимете контакти й нотатки у файл, щоб дані не зникали після перезапуску програми — це і є персистентність.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — щоденник заповниться й покаже всі записи. Додайте свій рядок у будь-який <code>f.write(...)</code> і запустіть ще раз. 📄`,
     code:'with open("diary.txt", "w") as f:\n    f.write("Понеділок: почав курс\\n")\n    f.write("Вівторок: розібрав файли\\n")\nwith open("diary.txt", "a") as f:\n    f.write("Середа: написав щоденник сам\\n")\nwith open("diary.txt", "r") as f:\n    lines = [line.strip() for line in f.readlines()]\nprint("Записів у щоденнику:", len(lines))\nfor line in lines:\n    print(" -", line)\n'}
  ]},

  "path-1": {title:"Шляхи й файли · крок 1 (ім'я і розширення)", items:[
    {type:"note", text:`<b>📁 Сучасний спосіб — pathlib.</b> <code>Path("шлях")</code> робить зі шляху зручний об'єкт, який «знає» свої частини: <code>.name</code> — ім'я файлу, <code>.suffix</code> — розширення.`},
    {type:"run",
     prompt:`Розберемо шлях на частини — ім'я файлу й розширення. Запустіть.`,
     code:'from pathlib import Path\np = Path("documents/report.txt")\nprint("Назва файлу:", p.name)\nprint("Розширення:", p.suffix)\n'},
    {type:"task",
     prompt:`Виведіть <b>розширення</b> файлу. Допишіть рядок <code>print(p.suffix)</code>. Для <code>photo.jpg</code> має вийти <code>.jpg</code>.`,
     starter:'from pathlib import Path\np = Path("photo.jpg")\n# допишіть рядок, що виведе розширення файлу\n',
     expected:".jpg"}
  ]},

  "path-2": {title:"Шляхи й файли · крок 2 (змінити розширення)", items:[
    {type:"note", text:`<b>З теми.</b> <code>.with_suffix(".нове")</code> повертає новий шлях зі зміненим розширенням (сам файл на диску не чіпає — це лише новий об'єкт-шлях).`},
    {type:"run",
     prompt:`Змінимо розширення <code>.txt</code> на <code>.md</code>. Запустіть.`,
     code:'from pathlib import Path\np = Path("report.txt")\nprint(p.with_suffix(".md"))\n'},
    {type:"task",
     prompt:`Змініть розширення на <code>.pdf</code>. Допишіть рядок <code>print(p.with_suffix(".pdf"))</code>. Має вийти <code>report.pdf</code>.`,
     starter:'from pathlib import Path\np = Path("report.txt")\n# допишіть рядок, що виведе шлях зі зміненим розширенням на .pdf\n',
     expected:"report.pdf"}
  ]},

  "path-3": {title:"Шляхи й файли · крок 3 (запис і читання через Path)", items:[
    {type:"note", text:`<b>З теми.</b> <code>Path</code> уміє сам писати й читати текст: <code>write_text(текст)</code> записує, <code>read_text()</code> читає — коротше, ніж <code>with open</code>.`},
    {type:"run",
     prompt:`Запишемо й прочитаємо файл через <code>Path</code>, без <code>with open</code>. Запустіть.`,
     code:'from pathlib import Path\np = Path("note.txt")\np.write_text("Привіт від pathlib", encoding="utf-8")\nprint(p.read_text(encoding="utf-8"))\n'},
    {type:"task",
     prompt:`Прочитайте вміст файлу. Допишіть рядок <code>print(p.read_text(encoding="utf-8"))</code>. Має вийти <code>Моя нотатка</code>.`,
     starter:'from pathlib import Path\np = Path("note.txt")\np.write_text("Моя нотатка", encoding="utf-8")\n# допишіть рядок, що прочитає й виведе вміст файлу\n',
     expected:"Моя нотатка"}
  ]},

  "path-4": {title:"Шляхи й файли · крок 4 (чи існує файл)", items:[
    {type:"note", text:`<b>З теми.</b> <code>.exists()</code> перевіряє, чи файл (або директорія) реально існує — повертає <code>True</code> або <code>False</code>. Зручно перевірити перед читанням.`},
    {type:"run",
     prompt:`Перевіримо існування двох файлів: створеного й вигаданого. Запустіть.`,
     code:'from pathlib import Path\np = Path("note.txt")\np.write_text("є", encoding="utf-8")\nprint("Існує note.txt?", p.exists())\nprint("Існує nope.txt?", Path("nope.txt").exists())\n'}
  ]},

  "path-final": {title:"Шляхи й файли · фінал", items:[
    {type:"note", text:`<b>Паспорт файлу.</b> Через <code>Path</code> дізнаємось про файл усе: ім'я, розширення, чи існує, і його вміст — усе разом.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — ось повний «паспорт» файлу. Поміняйте ім'я в <code>Path("report.txt")</code> чи текст і запустіть ще раз. 📁`,
     code:'from pathlib import Path\np = Path("report.txt")\np.write_text("Квартальний звіт", encoding="utf-8")\nprint("Назва:    ", p.name)\nprint("Розширення:", p.suffix)\nprint("Існує:    ", p.exists())\nprint("Вміст:    ", p.read_text(encoding="utf-8"))\n'},

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 5 — файли та pathlib",
  intro:`Тут ви працюєте з файлами — і це справжній файловий I/O прямо в браузері (файли живуть під час запуску). Спершу ведемо щоденник у файлі: зберігаємо записи й читаємо назад через <code>with open</code>. Потім переходимо на сучасний <code>pathlib</code>: розбираємо шляхи, міняємо розширення, пишемо й читаємо файли об'єктом <code>Path</code>.`,
  groups:[
    {name:"📄 Кейс · Щоденник у файлі", desc:`Основи файлів: безпечно відкрити й закрити (<code>with open</code>), записати (<code>write</code>) і прочитати (<code>read</code>, <code>readlines</code>), дописати в кінець (режим <code>"a"</code>). У фіналі — міні-щоденник.`, blocks:["file-1","file-2","file-3","file-final"]},
    {name:"📁 Кейс · Шляхи й файли (pathlib)", desc:`Сучасний <code>pathlib</code>: ім'я та розширення шляху (<code>.name</code>, <code>.suffix</code>), зміна розширення (<code>.with_suffix</code>), запис/читання (<code>write_text</code>, <code>read_text</code>), перевірка існування (<code>.exists</code>). У фіналі — «паспорт файлу».`, blocks:["path-1","path-2","path-3","path-4","path-final"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки з файлами й pathlib та ідіоми Python. Необов'язково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
