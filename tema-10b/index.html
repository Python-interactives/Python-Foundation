<script>
const BLOCKS = {
  "call-1": {title:"Функтори · крок 1 (__call__)", items:[
    {type:"note", text:`<b>🎯 Функтор</b> — обʼєкт, який можна викликати як функцію. Досягається магічним методом <code>__call__</code>: коли ви пишете <code>obj(...)</code>, Python викликає <code>obj.__call__(...)</code>. Перевага перед звичайною функцією — обʼєкт може <b>зберігати стан</b> (налаштування) між викликами.`},
    {type:"run",
     prompt:`<code>Multiplier</code> налаштовується один раз, а потім викликається як функція. Запустіть.`,
     code:'class Multiplier:\n    def __init__(self, factor):\n        self.factor = factor\n    def __call__(self, x):\n        return x * self.factor\n\ndouble = Multiplier(2)\ntriple = Multiplier(3)\nprint(double(10))\nprint(triple(10))\n'},
    {type:"task",
     prompt:`<code>Adder</code> додає налаштоване число. Викличте <code>add5</code> з <code>10</code>: допишіть <code>print(add5(10))</code>. Має вийти <code>15</code>.`,
     starter:'class Adder:\n    def __init__(self, n):\n        self.n = n\n    def __call__(self, x):\n        return x + self.n\n\nadd5 = Adder(5)\n# викличте add5 з числом 10\n',
     expected:"15"}
  ]},

  "call-2": {title:"Функтори · крок 2 (стан між викликами)", items:[
    {type:"note", text:`Головна відмінність від функції — <b>памʼять</b>. Функтор тримає лічильники, кеш, налаштування у своїх полях, тож кожен виклик може залежати від попередніх.`},
    {type:"run",
     prompt:`<code>Counter</code> памʼятає, скільки разів його викликали. Запустіть.`,
     code:'class Counter:\n    def __init__(self):\n        self.count = 0\n    def __call__(self):\n        self.count += 1\n        return self.count\n\nc = Counter()\nprint(c())\nprint(c())\nprint(c())\n'},
    {type:"task",
     prompt:`<code>Counter</code> викликали двічі. Скільки показує його поле? Допишіть <code>print(c.count)</code>. Має вийти <code>2</code>.`,
     starter:'class Counter:\n    def __init__(self):\n        self.count = 0\n    def __call__(self):\n        self.count += 1\n        return self.count\n\nc = Counter()\nc()\nc()\n# скільки разів викликали?\n',
     expected:"2"},
    {type:"mcq", q:`Який магічний метод робить обʼєкт «викликним» (як функцію)?`,
     opts:["__call__","__init__","__func__"], answer:"__call__",
     expl:`Саме <code>__call__</code> спрацьовує на <code>obj(...)</code>. <code>__init__</code> лише створює обʼєкт.`}
  ]},

  "iter-1": {title:"Ітератори · __iter__ та __next__", items:[
    {type:"note", text:`<b>🔁 Ітератор</b> — обʼєкт, по якому можна проходити в циклі <code>for</code>. Треба два методи: <code>__iter__</code> (повертає сам ітератор, зазвичай <code>self</code>) та <code>__next__</code> (повертає наступний елемент, а коли вони скінчились — «кидає» <code>StopIteration</code>).`},
    {type:"run",
     prompt:`<code>CountDown</code> — власний ітератор зворотного відліку. Запустіть.`,
     code:'class CountDown:\n    def __init__(self, start):\n        self.n = start\n    def __iter__(self):\n        return self\n    def __next__(self):\n        if self.n <= 0:\n            raise StopIteration\n        value = self.n\n        self.n -= 1\n        return value\n\nfor x in CountDown(3):\n    print(x)\n'},
    {type:"task",
     prompt:`Ітератор працює зі вбудованими функціями. Порахуйте суму відліку <code>5+4+3+2+1</code>: допишіть <code>print(sum(CountDown(5)))</code>. Має вийти <code>15</code>.`,
     starter:'class CountDown:\n    def __init__(self, start):\n        self.n = start\n    def __iter__(self):\n        return self\n    def __next__(self):\n        if self.n <= 0:\n            raise StopIteration\n        value = self.n\n        self.n -= 1\n        return value\n\n# сума всіх чисел відліку від 5\n',
     expected:"15"},
    {type:"mcq", q:`Що має «кинути» <code>__next__</code>, коли елементи скінчились?`,
     opts:["StopIteration","StopError","повернути None"], answer:"StopIteration",
     expl:`<code>for</code> ловить саме <code>StopIteration</code> і на цьому спокійно завершує цикл. Повернути <code>None</code> — не спрацює як сигнал кінця.`}
  ]},

  "gen-1": {title:"Генератори · крок 1 (yield)", items:[
    {type:"note", text:`<b>🌀 Генератор</b> — коротший спосіб зробити ітератор: звичайна функція, але замість <code>return</code> — <code>yield</code>. Кожен <code>yield</code> «віддає» значення й <b>ставить функцію на паузу</b> до наступного запиту. Значення обчислюються <b>ліниво</b> (по одному), тож памʼять не витрачається на весь список.`},
    {type:"run",
     prompt:`Той самий відлік, але генератором — без класу. І трохи <code>next()</code> вручну. Запустіть.`,
     code:'def count_down(start):\n    while start > 0:\n        yield start\n        start -= 1\n\nfor x in count_down(3):\n    print(x)\n\ngen = count_down(2)\nprint(next(gen))\nprint(next(gen))\n'},
    {type:"task",
     prompt:`Генератор квадратів. Порахуйте суму <code>1+4+9+16</code>: допишіть <code>print(sum(squares(4)))</code>. Має вийти <code>30</code>.`,
     starter:'def squares(n):\n    for i in range(1, n + 1):\n        yield i * i\n\n# сума квадратів від 1 до 4\n',
     expected:"30"}
  ]},

  "gen-2": {title:"Генератори · крок 2 (send і close)", items:[
    {type:"note", text:`Генератор — двобічний. <code>gen.send(value)</code> не лише відновлює його, а й <b>передає значення</b> всередину (стає результатом <code>x = yield</code>). <code>gen.close()</code> <b>зупиняє</b> генератор — усередині на місці <code>yield</code> виникає <code>GeneratorExit</code>. Перед першим <code>send</code> генератор «розганяють» через <code>next()</code>.`},
    {type:"run",
     prompt:`Акумулятор приймає числа через <code>send</code> і додає їх. Запустіть.`,
     code:'def accumulator():\n    total = 0\n    while True:\n        value = yield total\n        if value is not None:\n            total += value\n\nacc = accumulator()\nnext(acc)            # розігнати генератор\nprint(acc.send(10))\nprint(acc.send(5))\nacc.close()\nprint("closed")\n'},
    {type:"task",
     prompt:`<code>doubler</code> виводить подвоєне число, яке ви в нього надішлете. Розігнали через <code>next</code> — тепер надішліть <code>21</code>: допишіть <code>g.send(21)</code>. Має вийти <code>42</code>.`,
     starter:'def doubler():\n    while True:\n        x = yield\n        print(x * 2)\n\ng = doubler()\nnext(g)\n# надішліть 21 у генератор\n',
     expected:"42"},
    {type:"mcq", q:`Що робить <code>gen.close()</code>?`,
     opts:["зупиняє генератор (усередині виникає GeneratorExit)","видаляє останнє значення","перезапускає з початку"], answer:"зупиняє генератор (усередині виникає GeneratorExit)",
     expl:`<code>close()</code> завершує генератор: на місці <code>yield</code> «кидається» <code>GeneratorExit</code>, що дає змогу прибрати ресурси у <code>finally</code>.`}
  ]},

  "ctx-1": {title:"Менеджери контексту · крок 1 (__enter__/__exit__)", items:[
    {type:"note", text:`<b>🚪 Менеджер контексту</b> — обʼєкт для конструкції <code>with</code>, що гарантує «прибирання». <code>__enter__</code> виконується на вході (повертає ресурс — те, що після <code>as</code>), а <code>__exit__</code> — на виході, <b>навіть якщо всередині сталася помилка</b>. Класичний приклад — файли: відкрити на вході, закрити на виході.`},
    {type:"run",
     prompt:`Простий менеджер, що друкує «вхід» і «вихід» навколо тіла <code>with</code>. Запустіть.`,
     code:'class Managed:\n    def __enter__(self):\n        print("enter")\n        return self\n    def __exit__(self, exc_type, exc_val, exc_tb):\n        print("exit")\n\nwith Managed() as m:\n    print("inside")\n'},
    {type:"mcq", q:`Коли виконається <code>__exit__</code>?`,
     opts:["завжди при виході з with (навіть якщо сталася помилка)","лише якщо помилки не було","лише якщо викликати вручну"], answer:"завжди при виході з with (навіть якщо сталася помилка)",
     expl:`Саме тому <code>with</code> надійний для ресурсів: <code>__exit__</code> (закриття файлу, звільнення) відпрацює за будь-якого сценарію виходу.`}
  ]},

  "ctx-2": {title:"Менеджери контексту · крок 2 (@contextmanager)", items:[
    {type:"note", text:`Менеджер можна написати <b>коротше</b> — як генератор із декоратором <code>@contextmanager</code> з модуля <code>contextlib</code>. Код <b>до <code>yield</code></b> — це «вхід» (<code>__enter__</code>), значення після <code>yield</code> потрапляє в <code>as</code>, а код <b>після <code>yield</code></b> — це «вихід» (<code>__exit__</code>).`},
    {type:"run",
     prompt:`Той самий менеджер, але генератором. Запустіть і зіставте з попереднім.`,
     code:'from contextlib import contextmanager\n\n@contextmanager\ndef managed():\n    print("setup")\n    yield "resource"\n    print("teardown")\n\nwith managed() as r:\n    print("using", r)\n'},
    {type:"task",
     prompt:`У генераторі-менеджері бракує точки розділу «вхід/вихід». Замість <code>______</code> впишіть <code>yield</code>, щоб керування пішло в блок <code>with</code>. Має вийти <code>open</code>, <code>work</code>, <code>close</code>.`,
     starter:'from contextlib import contextmanager\n\n@contextmanager\ndef resource():\n    print("open")\n    ______\n    print("close")\n\nwith resource():\n    print("work")\n',
     expected:"open\nwork\nclose"},
    {type:"note", text:`<details style="margin:0"><summary style="cursor:pointer;font-weight:600">🎯 Де це у твоєму напрямку <span style="opacity:.6;font-weight:400">(можна розгорнути або пропустити)</span></summary><div style="margin-top:8px;line-height:1.6"><b>AI&amp;ML.</b> Генератори — потокова обробка даних без завантаження всього в памʼять (батчі, читання великих файлів); менеджери контексту — сесії/девайси, які треба гарантовано звільнити.<br><b>SE&amp;AI.</b> Функтори — конфігуровані «колбеки»; ітератори/генератори — ліниві пайплайни; <code>with</code> — транзакції, зʼєднання, локи, які закриваються самі.<br><b>CyberSec&amp;AI.</b> Генератори — построкове сканування логів; <code>with</code> — надійне закриття сокетів/файлів навіть при винятку.<br><b>PM&amp;AI.</b> Розуміння «лінивості» та гарантованого прибирання ресурсів допомагає оцінювати надійність і продуктивність рішень.</div></details>`}
  ]},

  "experienced": {title:"Для впевнених — нюанси та ідіоми", items:[
    {type:"note", text:`Цей блок — для впевнених. Спершу <b>пастки</b>, далі — короткі <b>ідіоми</b>. Спробуйте відповісти самі — пояснення зʼявиться після відповіді.`},
    {type:"mcq", q:`Чим функтор (обʼєкт із <code>__call__</code>) кращий за звичайну функцію?`,
     opts:["може зберігати стан між викликами","завжди швидший","коротший запис"], answer:"може зберігати стан між викликами",
     expl:`Функція «забуває» все між викликами; функтор тримає стан у полях (лічильники, налаштування, кеш).`},
    {type:"mcq", code:"def gen():\n    yield 1\n    yield 2\ng = gen()\nprint(next(g))\nprint(next(g))", opts:["1, потім 2","2, потім 1","помилка"], answer:"1, потім 2",

    {type:"mcq", q:`Генератор обчислює значення...`,

     expl:`Саме лінивість дає економію памʼяті: можна проходити навіть «нескінченні» послідовності.`},
    {type:"note", text:`<b>Тепер ідіоми.</b>`},
    {type:"task",

       {q:`Головна перевага функтора над функцією —`, opts:["зберігає стан між викликами","коротший код","не потребує аргументів"], answer:"зберігає стан між викликами", section:"Функтори: стан"},

       {q:`У <code>@contextmanager</code> код після <code>yield</code> — це...`, opts:["«вихід» (__exit__)","«вхід» (__enter__)","тіло with"], answer:"«вихід» (__exit__)", section:"@contextmanager"}

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 10b — функтори, ітератори, генератори та менеджери контексту",
  intro:`Тут ви опановуєте «динамічні» можливості класів: <b>функтори</b> (обʼєкт-функція через <code>__call__</code>, що зберігає стан), <b>ітератори</b> (<code>__iter__</code>/<code>__next__</code>) та <b>генератори</b> (<code>yield</code>, а також двобічні <code>send()</code>/<code>close()</code>), і <b>менеджери контексту</b> (<code>with</code>: <code>__enter__</code>/<code>__exit__</code> та <code>@contextlib.contextmanager</code>) для гарантованого прибирання ресурсів. Усе запускається прямо тут.`,
  groups:[
    {name:"🎯 Функтори (__call__)", desc:`Обʼєкт, який викликають як функцію; на відміну від функції — <b>зберігає стан</b> між викликами.`, blocks:["call-1","call-2"]},
    {name:"🔁 Ітератори", desc:`<code>__iter__</code> + <code>__next__</code>; кінець послідовності — <code>StopIteration</code>.`, blocks:["iter-1"]},
    {name:"🌀 Генератори (yield, send, close)", desc:`Ітератор у два рядки через <code>yield</code>; лінива генерація; двобічний обмін через <code>send()</code> і зупинка <code>close()</code>.`, blocks:["gen-1","gen-2"]},
    {name:"🚪 Менеджери контексту", desc:`<code>with</code>: <code>__enter__</code>/<code>__exit__</code> для гарантованого прибирання, і коротка форма <code>@contextmanager</code>.`, blocks:["ctx-1","ctx-2"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки (стан функтора, лінивість, порядок <code>yield</code>) та ідіоми. Необовʼязково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
