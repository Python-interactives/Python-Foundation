<style>
  :root, [data-theme="light"]{
    --bg:#FFFFFF;--panel:#F6F7F9;--panel2:#ECEEF1;--border:#E4E5EA;
    --white:#1F2430;--muted:#7C828F;--accent:#F2661F;--accent-ink:#D1550F;
    --green:#1E9E52;--greenbg:#E6F4EA;--red:#D64545;--redbg:#FBE9E8;
    --blue:#F2661F;--bluebg:#FCEBE0;--violet:#7C5CD6;--violetbg:#EFE9FC;
    --code-bg:#ECEDF1;--code-fg:#33353b;--code-bd:#DEDFE4;
  }
  [data-theme="dark"]{
    --bg:#171A22;--panel:#1E222C;--panel2:#262B38;--border:#2B303C;
    --white:#E7EAF1;--muted:#828A99;--accent:#FF7D45;--accent-ink:#FF9160;
    --green:#3FB950;--greenbg:#123420;--red:#f85149;--redbg:#3a1414;
    --blue:#FF7D45;--bluebg:#3a2418;--violet:#b9a4ff;--violetbg:#241d40;
    --code-bg:#2A2F3B;--code-fg:#CFD5E0;--code-bd:#39404E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--white);font-family:"Montserrat",-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6;font-size:15px;transition:background .25s,color .25s}
  .wrap{max-width:740px;margin:0 auto;padding:20px 16px 80px}

  .badge{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-weight:500}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}

  .tag.g{background:var(--greenbg);color:var(--green)}
  .tag.c{background:var(--violetbg);color:var(--violet)}
  pre{background:#0F141A;color:#D3DAE4;padding:14px;border-radius:8px;overflow:auto;font-size:14px;margin:0 0 14px;border:1px solid #23262e}
  code{font-family:"JetBrains Mono","SF Mono",Consolas,Menlo,monospace;font-size:.88em;background:var(--code-bg);color:var(--code-fg);border:1px solid var(--code-bd);border-radius:5px;padding:1px 5px}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{text-align:left;background:var(--panel2);border:1px solid var(--border);color:var(--white);padding:11px 14px;border-radius:8px;cursor:pointer;font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-size:14px}
  .opt:hover{border-color:var(--accent)}
  .opt.correct{border-color:var(--green);background:var(--greenbg)}
  .opt.wrong{border-color:var(--red);background:var(--redbg)}

  .chip{display:inline-block;margin:4px 6px 4px 0;background:var(--panel2);border:1px solid var(--border);color:var(--white);padding:8px 13px;border-radius:8px;cursor:pointer;font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-size:14px}
  .chip.sel{border-color:var(--accent);background:var(--bluebg)}
  .chip.ok{border-color:var(--green);background:var(--greenbg)}
  .chip.bad{border-color:var(--red);background:var(--redbg)}
  textarea{width:100%;min-height:120px;background:#0F141A;color:#D3DAE4;border:1px solid #23262e;border-radius:8px;padding:12px;font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-size:14px;resize:vertical}
  .out{margin-top:12px;font-size:13px;white-space:pre-wrap;font-family:"JetBrains Mono","SF Mono",Consolas,monospace}
  .out:not(:empty){background:#0F141A;color:#D3DAE4;padding:12px 14px;border-radius:8px;border:1px solid #23262e}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .fb{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px;display:none;white-space:pre-wrap}
  .fb.show{display:block}.fb.ok{background:var(--greenbg);border:1px solid var(--green)}.fb.no{background:var(--redbg);border:1px solid var(--red)}
  .btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
  .btn:hover{background:var(--accent-ink)} [data-theme="dark"] .btn:hover{filter:brightness(1.08)}
  a{color:var(--accent-ink)} [data-theme="dark"] a{color:var(--accent)} .muted{color:var(--muted)}
  .idx a{display:block;padding:6px 0;border-bottom:1px solid var(--border)}
  .themetoggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:5px 11px 5px 9px;font:inherit;font-size:11px;font-weight:600;letter-spacing:.5px}
  .themetoggle:hover{border-color:var(--accent);color:var(--accent-ink)} [data-theme="dark"] .themetoggle:hover{color:var(--accent)}
  .themetoggle svg{width:13px;height:13px}
  .themetoggle .l-dark{display:none}
  [data-theme="dark"] .themetoggle .l-light{display:none}
  [data-theme="dark"] .themetoggle .l-dark{display:inline}

<script>
const BLOCKS = {
  "app-1": {title:"Замовлення · крок 1 (оператори, порівняння)", items:[
    {type:"note", text:`<b>🛵 Будуємо застосунок доставки.</b> На ньому тренуємо числа, типи й f-рядки — бо саме такі обчислення робить будь-який кошик. Збиратимемо його по шматочку протягом частини 1.<br><br><b>З теми:</b> ви щойно розібрали оператори (множення <code>*</code>, додавання <code>+</code>) і порівняння (<code>&gt;=</code>, що повертає <code>True</code> або <code>False</code>). Застосуймо.`},
    {type:"run",
     prompt:`Застосунок рахує суму замовлення: ціна одного круасана — 55 грн, замовляємо 4. Натисніть «Запустити». Потім змініть <code>quantity</code> чи <code>price</code> і запустіть ще раз — побачите, як перерахується сума.`,
     code:"price = 55\nquantity = 4\ntotal = price * quantity\nprint(total)\n"},
    {type:"task",
     prompt:`Доставка безкоштовна від 300 грн. Допишіть рядок <code>print(total >= 300)</code> — він виведе <code>True</code> або <code>False</code>. Сума тут 220, тож має вийти <code>False</code>.`,
     starter:"price = 55\nquantity = 4\ntotal = price * quantity\n# допишіть рядок, що виведе, чи total >= 300\n",
     expected:"False"}
  ]},

  "app-2": {title:"Замовлення · крок 2 (приведення типів, f-рядки)", items:[
    {type:"note", text:`<b>З теми.</b> Дані від застосунку часто приходять як <b>текст</b>, тож перед обчисленнями їх перетворюють на число функцією <code>int()</code>. А щоб скласти повідомлення зі значеннями — використовують f-рядок.`},
    {type:"task",
     prompt:`Кількість прийшла <b>текстом</b>: <code>quantity = "4"</code>, і <code>price * quantity</code> працює неправильно (запустіть — побачите). Виправте рядок на <code>total = price * int(quantity)</code>, щоб кількість стала числом. Має вийти <code>220</code>.`,
     starter:'price = 55\nquantity = "4"             # прийшло як текст\ntotal = price * quantity     # ← виправте цей рядок\nprint(total)\n',
     expected:"220"},
    {type:"run",
     prompt:`Тепер застосунок складає підтвердження замовлення з ім'ям і сумою. Запустіть, а потім підставте у <code>name</code> своє ім'я.`,
     code:'name = "Олег"\ntotal = 220\nprint(f"{name}, ваше замовлення на {total} грн прийнято!")\n'}
  ]},

  "app-3": {title:"Музичний плеєр · крок 1 (списки, словники)", items:[
    {type:"note", text:`<b>🎵 Будуємо музичний плеєр.</b> Тут оживають колекції: плейлист, картки треків, виконавці. Збиратимемо його через усю другу частину теми.<br><br><b>З теми:</b> список зберігає елементи по порядку (довжина — <code>len()</code>, доступ за індексом), а словник — пари «ключ → значення».`},
    {type:"run",
     prompt:`Плейлист — це список треків. Запустіть: програма покаже, скільки в ньому треків і який трек перший. Потім додайте чи приберіть трек у списку й запустіть знову.`,
     code:'playlist = ["Flowers", "As It Was", "Stay", "Anti-Hero", "Unholy"]\nprint(len(playlist))      # скільки треків\nprint(playlist[0])        # перший трек\n'},
    {type:"run",
     prompt:`Щоб додати трек у кінець плейлиста, використовують метод <code>.append()</code>. Запустіть; підставте свій трек у <code>.append(...)</code> і запустіть знову.`,
     code:'playlist = ["Flowers", "As It Was", "Stay"]\nplaylist.append("Anti-Hero")\nprint(playlist)\n'},
    {type:"task",
     prompt:`Картка треку — словник; значення дістають за ключем у квадратних дужках. Допишіть рядок <code>print(track["artist"])</code>, щоб вивести виконавця. Має вийти <code>Harry Styles</code>.`,
     starter:'track = {"title": "As It Was", "artist": "Harry Styles", "duration": 167}\n# допишіть рядок, що виведе виконавця\n',
     expected:"Harry Styles"}
  ]},

  "app-4": {title:"Музичний плеєр · крок 2 (множини, кортежі)", items:[
    {type:"note", text:`<b>З теми.</b> Множина містить лише <b>унікальні</b> елементи, а перетин (<code>&</code>) дає спільне. Кортеж — <b>незмінний</b> набір значень (зручно для запису, який не повинен мінятися).`},
    {type:"run",
     prompt:`У плейлисті виконавці повторюються. Щоб дізнатися, скільки <b>різних</b> виконавців, список перетворюють у множину (вона прибирає повтори). Запустіть.`,
     code:'artists = ["The Weeknd", "Harry Styles", "The Weeknd", "Taylor Swift", "Harry Styles"]\nprint(len(set(artists)))   # скільки різних виконавців\n'},
    {type:"task",
     prompt:`Spotify Blend шукає спільні треки. Перетин множин дає оператор <code>&</code>, а кількість — <code>len(...)</code>. Допишіть рядок <code>print(len(mine & friend))</code>. Має вийти <code>2</code>.`,
     starter:'mine   = {"Flowers", "Stay", "As It Was", "Anti-Hero"}\nfriend = {"Stay", "Unholy", "As It Was"}\n# допишіть рядок, що виведе кількість спільних треків\n',
     expected:"2"},
    {type:"run",
     prompt:`Один трек зручно зберігати як <b>кортеж</b>: (назва, виконавець, тривалість у секундах). Він незмінний — метадані треку не зміняться випадково. Запустіть; зверніть увагу на доступ за індексом, як у списку.`,
     code:'track = ("As It Was", "Harry Styles", 167)\nprint(track[0])      # назва\nprint(track[1])      # виконавець\n'}
  ]},

  "app-5": {title:"Музичний плеєр · крок 3 (рядки, зрізи)", items:[
    {type:"note", text:`<b>З теми.</b> У рядків багато методів (<code>.strip()</code> прибирає пробіли по краях, <code>.lower()</code> робить малими), а <b>зріз</b> бере частину списку.`},
    {type:"task",
     prompt:`Перед пошуком запит нормалізують: <code>.strip()</code> прибирає пробіли по краях, <code>.lower()</code> робить малі літери. Допишіть рядок <code>print(query.strip().lower())</code>. Для <code>"  Blinding LIGHTS  "</code> має вийти <code>blinding lights</code>.`,
     starter:'query = "  Blinding LIGHTS  "\n# допишіть рядок: приберіть пробіли по краях і зробіть малими літерами\n',
     expected:"blinding lights"},
    {type:"run",
     prompt:`На головній плеєр показує перші 3 треки плейлиста (зріз <code>[:3]</code>) та нещодавно додані (у зворотному порядку <code>[::-1]</code>). Запустіть.`,
     code:'playlist = ["Flowers", "As It Was", "Stay", "Anti-Hero", "Unholy"]\nprint(playlist[:3])      # перші 3\nprint(playlist[::-1])    # нещодавні спочатку\n'}
  ]},

  "app-final": {title:"Музичний плеєр · фінал", items:[
    {type:"note", text:`<b>Збираємо все докупи.</b> Плеєр рахує треки у списку, унікальних виконавців через множину й виводить короткий опис плейлиста f-рядком.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — плеєр покаже підсумок плейлиста. Дайте йому свою назву в <code>name</code> й додайте трек у список — побачите, як зміниться підсумок. 🎵`,
     code:'playlist = ["Flowers", "As It Was", "Stay", "Anti-Hero", "Unholy"]\nartists  = ["Miley Cyrus", "Harry Styles", "Harry Styles", "Taylor Swift", "Sam Smith"]\nname = "Мій вечірній мікс"\nprint(f"{name}: {len(playlist)} треків, {len(set(artists))} виконавців")\n'},
    {type:"note", text:`🔗 <b>Це фундамент.</b> Уся абетка Python — типи, оператори, колекції — далі щодня працює на вас, зокрема у фінальному проєкті.<br><br><details style="margin-top:6px"><summary style="cursor:pointer;font-weight:600">🎯 Де це у твоєму напрямку <span style="opacity:.6;font-weight:400">(можна розгорнути або пропустити)</span></summary><div style="margin-top:8px;line-height:1.6"><b>AI&amp;ML.</b> Дані з файлів і форм приходять рядками — ви постійно приводите їх до чисел перед обчисленнями; а похибка float рятує від хибних метрик.<br><b>SE&amp;AI.</b> <code>input</code>/<code>print</code> і перевірка введеного — зародок валідації, з якої починається будь-який сервіс чи CLI.<br><b>CyberSec&amp;AI.</b> Перше правило безпеки — не довіряти вводу: він завжди рядок, і його свідомо приводять і перевіряють.<br><b>PM&amp;AI.</b> Замість калькулятора — маленький скрипт, що рахує на будь-яких числах, а f-рядки складуть результат у звіт.</div></details>`}
  ]},

  "experienced": {title:"Для впевнених — нюанси та ідіоми", items:[
    {type:"note", text:`Цей блок — для тих, хто вже програмує. Спочатку кілька <b>пасток</b> — це місця, де Python поводиться не так, як можна очікувати; саме на них ловлять баги навіть досвідчені, тож варто впізнавати їх заздалегідь. Далі — <b>ідіоми</b>: короткі, узвичаєні способи записати щось «по-пайтонічному», як пишуть досвідчені пайтоністи. Спершу спробуйте відповісти самі — пояснення з'явиться після відповіді.`},
    {type:"mcq", code:"print(0.1 + 0.2 == 0.3)", opts:["False","True","помилка"], answer:"False",
     expl:"float — приблизний (IEEE 754): 0.1+0.2 ≈ 0.30000000000000004, тож пряме == дає False. Порівнюйте з допуском."},
    {type:"mcq", code:"print(type((1)).__name__, type((1,)).__name__)", opts:["int tuple","tuple tuple","int int"], answer:"int tuple",
     expl:"(1) — це просто число в дужках. Кортеж робить кома: (1,)."},
    {type:"mcq", code:"a = [1, 2]\nb = [1, 2]\nprint(a == b, a is b)", opts:["True False","True True","False False"], answer:"True False",

    {type:"mcq", code:"print(sum([True, True, False]))", opts:["2","TypeError","[True, True, False]"], answer:"2",
     expl:"bool — підклас int: True=1, False=0. Зручно рахувати, скільки умов справдилось."},
    {type:"mcq", q:`Що швидше для перевірки <code>x in колекція</code>, якщо в колекції мільйон елементів?`,

    {type:"note", text:`<b>Тепер ідіоми.</b> Нижче — короткі завдання: записати щось «по-пайтонічному», одним рядком. Якщо ви звикли до Java чи C, саме тут найбільше нового — Python часто дозволяє коротше.`},
    {type:"task",
     prompt:`<b>Ідіома.</b> Поміняйте місцями значення <code>a</code> і <code>b</code> <b>одним рядком</b>, без тимчасової змінної. Має вивестися <code>2 1</code>.`,
     starter:"a = 1\nb = 2\n# поміняйте місцями a і b одним рядком (тут)\nprint(a, b)\n",

    {type:"task",

  "review": {title:"Перевір себе — що повторити", items:[
    {type:"diagnostic",
     intro:`Коротка перевірка по всій темі. Дайте відповідь на всі питання — наприкінці підкажемо, які розділи конспекту варто повторити (саме ті, де ви помилитесь).`,
     questions:[
       {code:"print(0.1 + 0.2)", opts:["0.3","0.30000000000000004","0.303"], answer:"0.30000000000000004", section:"Типи даних (числа)"},
       {code:"print(-3 ** 2)", opts:["-9","9","6"], answer:"-9", section:"Оператори та пріоритет"},
       {scenario:'Користувач увів "18".', code:"age = input()\nprint(age + 1)", opts:["19","181","TypeError"], answer:"TypeError", section:"Приведення типів"},
       {code:"print([1, 2, 3][::-1])", opts:["[3, 2, 1]","[1, 2, 3]","error"], answer:"[3, 2, 1]", section:"Зрізи"},
       {scenario:'d = {"name": "Alice"}', code:'print(d.get("age"))', opts:["None","KeyError","0"], answer:"None", section:"Словники"},
       {scenario:"a = {1, 2, 3}; b = {3, 4, 5}", code:"print(a & b)", opts:["{3}","{1, 2, 4, 5}","{1, 2, 3, 4, 5}"], answer:"{3}", section:"Множини"},
       {code:"print(type((1,)).__name__)", opts:["tuple","int","list"], answer:"tuple", section:"Кортежі"},

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 1 — синтаксис, типи, колекції",
  intro:`Тут ви пробуєте руками все, що є в темі: типи даних, оператори, приведення типів і колекції. Замість сухих вправ ми будуємо два маленькі застосунки — <b>кошик замовлення</b> і <b>музичний плеєр</b> — і на них відпрацьовуємо кожен концепт. Запускайте код, міняйте значення, робіть міні-завдання.`,
  groups:[
    {name:"🛵 Кейс 1 · Замовлення", desc:`Числа, типи, приведення типів і f-рядки — на прикладі доставки їжі. Рахуємо суму кошика, застосовуємо поріг безкоштовної доставки, збираємо підтвердження замовлення.`, blocks:["app-1","app-2"]},
    {name:"🎵 Кейс 2 · Музичний плеєр", desc:`Колекції — списки, словники, множини, кортежі, зрізи й методи рядків — на прикладі плейлиста. Додаємо треки, шукаємо унікальних виконавців, нормалізуємо пошук.`, blocks:["app-3","app-4","app-5","app-final"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — тонкі місця й ідіоми Python, на яких спотикаються навіть досвідчені. Необов'язково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">🔒 Код виконується у вашому браузері — нічого не надсилається. Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
</script>
