<script>
const BLOCKS = {
  "str-1": {title:"Магічні методи · __str__ vs __repr__", items:[
    {type:"note", text:`<b>🎭 Магічні (dunder) методи</b> — методи з подвійними підкресленнями, які Python викликає сам. <code>__str__</code> — «людське» представлення для <code>print()</code> (читабельне для користувача). <code>__repr__</code> — «технічне» представлення для розробника (однозначне; в ідеалі <code>eval(repr(obj))</code> відтворює обʼєкт). Якщо <code>__str__</code> немає — <code>print()</code> бере <code>__repr__</code>.`},
    {type:"mcq", code:"class Cat:\n    def __init__(self, name):\n        self.name = name\n    def __str__(self):\n        return \"Cat: \" + self.name\nprint(Cat(\"Tom\"))", opts:["Cat: Tom","Tom","<Cat>"], answer:"Cat: Tom", expl:`print бере рядок із методу __str__.`},
    {type:"run",
     prompt:`Один клас — два представлення. Запустіть і порівняйте, що виведе <code>print</code>, а що <code>repr</code>.`,
     code:'class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n    def __str__(self):\n        return f"{self.name}, {self.age} p."\n    def __repr__(self):\n        return f"Person({self.name!r}, {self.age})"\n\np = Person("Allen", 25)\nprint(p)\nprint(repr(p))\n'},
    {type:"task",
     prompt:`У <code>Cat</code> визначено <code>__str__</code>. Допишіть рядок <code>print(c)</code>, щоб побачити «людське» представлення. Має вийти <code>Cat: Simon</code>.`,
     starter:'class Cat:\n    def __init__(self, name):\n        self.name = name\n    def __str__(self):\n        return f"Cat: {self.name}"\n\nc = Cat("Simon")\n# виведіть обʼєкт\n',
     expected:"Cat: Simon"},
    {type:"mcq", q:`Яке представлення викличе <code>print(obj)</code>, якщо визначені обидва?`,
     opts:["__repr__ (технічне)","__init__","__str__ (людське)"], answer:"__str__ (людське)",
     expl:`<code>print()</code> віддає перевагу <code>__str__</code>. <code>__repr__</code> спрацював би, якби <code>__str__</code> не було, або через <code>repr(obj)</code> / в консолі.`}
  ]},

  "idx-1": {title:"Магічні методи · індексація [ ]", items:[
    {type:"note", text:`<b>📦 Індексація через <code>[ ]</code>.</b> <code>obj[key]</code> викликає <code>__getitem__(self, key)</code>, а <code>obj[key] = value</code> — <code>__setitem__(self, key, value)</code>. Так власний клас поводиться як список чи словник.`},
    {type:"run",
     prompt:`<code>SimpleDict</code> зберігає дані всередині й дає до них доступ через <code>[ ]</code>. Запустіть.`,
     code:'class SimpleDict:\n    def __init__(self):\n        self.data = {}\n    def __getitem__(self, key):\n        return self.data.get(key, "not found")\n    def __setitem__(self, key, value):\n        self.data[key] = value\n\nd = SimpleDict()\nd["name"] = "Allen"\nprint(d["name"])\nprint(d["age"])\n'},
    {type:"task",
     prompt:`<code>Squares</code> повертає квадрат індексу через <code>__getitem__</code>. Скільки буде <code>s[5]</code>? Допишіть <code>print(s[5])</code>. Має вийти <code>25</code>.`,
     starter:'class Squares:\n    def __getitem__(self, i):\n        return i * i\n\ns = Squares()\n# який елемент під індексом 5?\n',
     expected:"25"},
    {type:"mcq", q:`Який метод викликається під час <code>obj[key] = value</code>?`,
     opts:["__setitem__","__getitem__","__set__"], answer:"__setitem__",
     expl:`Присвоєння за індексом — це <code>__setitem__</code>. Читання (<code>obj[key]</code>) — <code>__getitem__</code>.`}
  ]},

  "math-1": {title:"Перевантаження операторів · крок 1 (+)", items:[
    {type:"note", text:`<b>➕ Перевантаження операторів.</b> Оператори — це теж магічні методи: <code>+</code> → <code>__add__</code>, <code>-</code> → <code>__sub__</code>, <code>*</code> → <code>__mul__</code>, <code>/</code> → <code>__truediv__</code>. Визначивши їх, ви задаєте, що означає «додати» два ваші обʼєкти.`},
    {type:"mcq", code:"class Money:\n    def __init__(self, amount):\n        self.amount = amount\n    def __add__(self, other):\n        return Money(self.amount + other.amount)\nprint((Money(50) + Money(30)).amount)", opts:["80","50","Money"], answer:"80", expl:`__add__ задає, що означає + для обʼєктів: 50+30=80.`},
    {type:"run",
     prompt:`<code>ComplexNumber</code> вміє додаватися через <code>+</code>. Запустіть.`,
     code:'class ComplexNumber:\n    def __init__(self, real, imag):\n        self.real = real\n        self.imag = imag\n    def __add__(self, other):\n        return ComplexNumber(self.real + other.real, self.imag + other.imag)\n    def __str__(self):\n        return f"{self.real} + {self.imag}i"\n\na = ComplexNumber(1, 2)\nb = ComplexNumber(3, 4)\nprint(a + b)\n'},
    {type:"task",
     prompt:`<code>Money</code> складається через <code>+</code>. Скільки грошей у <code>total</code>? Допишіть <code>print(total.amount)</code>. Має вийти <code>80</code>.`,
     starter:'class Money:\n    def __init__(self, amount):\n        self.amount = amount\n    def __add__(self, other):\n        return Money(self.amount + other.amount)\n\ntotal = Money(50) + Money(30)\n# виведіть суму\n',
     expected:"80"}
  ]},

  "math-2": {title:"Перевантаження операторів · крок 2 (* і __rmul__)", items:[
    {type:"note", text:`<b>Порядок операндів.</b> <code>vec * 3</code> викликає <code>vec.__mul__(3)</code>. А <code>3 * vec</code> спершу пробує <code>int.__mul__</code> — той не знає про <code>vec</code> і повертає <code>NotImplemented</code>, тож Python викликає <code>vec.__rmul__(3)</code>. Тому для симетрії визначають і <code>__rmul__</code>.`},
    {type:"run",
     prompt:`<code>Vector</code> множиться на число з обох боків завдяки <code>__rmul__</code>. Запустіть.`,
     code:'class Vector:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __mul__(self, k):\n        return Vector(self.x * k, self.y * k)\n    def __rmul__(self, k):\n        return self.__mul__(k)\n    def __str__(self):\n        return f"({self.x}, {self.y})"\n\nv = Vector(2, 3)\nprint(v * 10)\nprint(10 * v)\n'},
    {type:"task",
     prompt:`<code>Vec</code> множиться на число. Чому дорівнює <code>x</code> у результаті <code>Vec(4, 5) * 2</code>? Допишіть <code>print(r.x)</code>. Має вийти <code>8</code>.`,
     starter:'class Vec:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n    def __mul__(self, k):\n        return Vec(self.x * k, self.y * k)\n\nr = Vec(4, 5) * 2\n# виведіть r.x\n',
     expected:"8"}
  ]},

  "cmp-1": {title:"Оператори порівняння", items:[
    {type:"note", text:`<b>⚖️ Порівняння.</b> <code>==</code> → <code>__eq__</code>, <code>!=</code> → <code>__ne__</code>, <code>&lt;</code> → <code>__lt__</code>, <code>&lt;=</code> → <code>__le__</code>, <code>&gt;</code> → <code>__gt__</code>, <code>&gt;=</code> → <code>__ge__</code>. Так обʼєкти можна порівнювати за власним критерієм (напр. прямокутники — за площею). Для чужих типів прийнято повертати <code>NotImplemented</code>.`},
    {type:"run",
     prompt:`Два прямокутники порівнюються за площею. Запустіть.`,
     code:'class Rectangle:\n    def __init__(self, w, h):\n        self.w = w\n        self.h = h\n    def area(self):\n        return self.w * self.h\n    def __eq__(self, other):\n        return self.area() == other.area()\n    def __lt__(self, other):\n        return self.area() < other.area()\n\nr1 = Rectangle(2, 6)\nr2 = Rectangle(3, 5)\nprint(r1 == r2)\nprint(r1 < r2)\n'},
    {type:"task",
     prompt:`<code>Box</code> порівнюється за обʼємом через <code>__gt__</code>. Чи більший <code>a</code> за <code>b</code>? Допишіть <code>print(a > b)</code>. Має вийти <code>True</code>.`,
     starter:'class Box:\n    def __init__(self, volume):\n        self.volume = volume\n    def __gt__(self, other):\n        return self.volume > other.volume\n\na = Box(100)\nb = Box(50)\n# чи більший a за b?\n',
     expected:"True"},
    {type:"mcq", q:`Що краще повернути з <code>__eq__</code>, якщо тип іншого обʼєкта невідомий?`,
     opts:["False","NotImplemented","None"], answer:"NotImplemented",
     expl:`Повертаючи <code>NotImplemented</code>, ви дозволяєте Python спробувати зворотне порівняння або коректно завершити. Жорсткий <code>False</code> це унеможливив би.`}
  ]},

  "prop-1": {title:"Властивості · @property (getter/setter)", items:[
    {type:"note", text:`<b>🛡 <code>@property</code></b> робить метод доступним як атрибут (без дужок). Пара <b>гетер + сетер</b> дає керований доступ: назовні — звичне <code>obj.age</code>, а всередині сетер може <b>перевірити</b> значення перед присвоєнням. Зберігати краще у «прихованому» полі (<code>self._age</code>).`},
    {type:"run",
     prompt:`<code>age</code> — це властивість із перевіркою в сетері. Запустіть.`,
     code:'class Person:\n    def __init__(self, age):\n        self._age = age\n    @property\n    def age(self):\n        return self._age\n    @age.setter\n    def age(self, value):\n        if value < 0:\n            raise ValueError("Вік не може бути відʼємним")\n        self._age = value\n\np = Person(25)\nprint(p.age)\np.age = 30\nprint(p.age)\n'},
    {type:"task",
     prompt:`<code>balance</code> — властивість тільки для читання. Допишіть <code>print(a.balance)</code>, щоб отримати баланс через property. Має вийти <code>500</code>.`,
     starter:'class Account:\n    def __init__(self, balance):\n        self._balance = balance\n    @property\n    def balance(self):\n        return self._balance\n\na = Account(500)\n# виведіть баланс через властивість\n',
     expected:"500"},
    {type:"mcq", q:`Навіщо сетеру <code>@property</code> частина з <code>if</code>?`,

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

    {name:"⚖️ Оператори порівняння", desc:`<code>__eq__</code>, <code>__lt__</code>, <code>__gt__</code>… — порівняння за власним критерієм; <code>NotImplemented</code> для чужих типів.`, blocks:["cmp-1"]},
    {name:"🛡 Властивості (@property)", desc:`Гетер/сетер: доступ як до атрибута, але з <b>валідацією</b> присвоєння всередині.`, blocks:["prop-1"]},
    {name:"🔧 Статичні та класові методи", desc:`<code>@staticmethod</code> — функція в класі без <code>self</code>; <code>@classmethod</code> — альтернативний конструктор через <code>cls</code>.`, blocks:["sm-1"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки (<code>__repr__</code>, <code>__rmul__</code>, авто-<code>__ne__</code>) та ідіоми. Необовʼязково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
</script>
<script>
(function(){
  var f=document.querySelector(".snakeprog .fill"); if(!f) return;
  var h=document.documentElement;
  function upd(){
    var se=h.scrollHeight-h.clientHeight;
    var p=se>0?(h.scrollTop||document.body.scrollTop)/se:0;
    if(p<0)p=0; if(p>1)p=1;
    f.style.width=(p*100).toFixed(2)+"%";
  }
  addEventListener("scroll",upd,{passive:true});
  addEventListener("resize",upd);
  setTimeout(upd,60); setTimeout(upd,700); upd();
})();
</script>
<script>(function(){var b=document.getElementById("themeToggle"),r=document.documentElement;if(b)b.addEventListener("click",function(){var n=r.getAttribute("data-theme")==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("pf-theme",n);}catch(e){}});})();</script>
