<script>
const BLOCKS = {
  "fc-1": {title:"Функції-обʼєкти · крок 1 (присвоїти й передати)", items:[
    {type:"note", text:`<b>🧩 Функція — обʼєкт першого класу.</b> Це означає, що з функцією можна робити те саме, що й зі звичайним значенням: присвоїти змінній, передати в іншу функцію як аргумент, повернути з функції, покласти у список чи словник.<br><br>Тут будуємо «калькулятор операцій»: різні операції — це різні функції, і ми ними вільно оперуємо.`},
    {type:"run",
     prompt:`Присвоюємо функцію змінній, а ще передаємо функцію як <b>аргумент</b> у <code>apply_operation</code>. Запустіть.`,
     code:'def greet():\n    print("Привіт!")\n\nf = greet\nf()\n\ndef add(a, b):\n    return a + b\n\ndef multiply(a, b):\n    return a * b\n\ndef apply_operation(a, b, operation):\n    return operation(a, b)\n\nprint(apply_operation(5, 3, add))\nprint(apply_operation(5, 3, multiply))\n'},
    {type:"task",
     prompt:`Викличте <code>apply_operation</code> з функцією <code>multiply</code> для <code>6</code> і <code>7</code>. Допишіть рядок <code>print(apply_operation(6, 7, multiply))</code>. Має вийти <code>42</code>.`,
     starter:'def add(a, b):\n    return a + b\n\ndef multiply(a, b):\n    return a * b\n\ndef apply_operation(a, b, operation):\n    return operation(a, b)\n\n# викличте apply_operation з функцією multiply для 6 і 7\n',
     expected:"42"}
  ]},

  "fc-2": {title:"Функції-обʼєкти · крок 2 (повернути функцію)", items:[
    {type:"note", text:`Функція може <b>повертати іншу функцію</b>. <code>power(2)</code> віддає нову функцію, яка підносить до квадрата, <code>power(3)</code> — до куба. Внутрішня функція «запамʼятовує» значення <code>exponent</code>.`},
    {type:"run",
     prompt:`<code>power</code> будує нові функції <code>square</code> і <code>cube</code>. Запустіть.`,
     code:'def power(exponent):\n    def inner(base):\n        return base ** exponent\n    return inner\n\nsquare = power(2)\ncube = power(3)\nprint(square(4))\nprint(cube(4))\n'},
    {type:"task",
     prompt:`Функцію <code>cube = power(3)</code> уже створено. Виведіть <code>cube(2)</code> — допишіть рядок <code>print(cube(2))</code>. Має вийти <code>8</code>.`,
     starter:'def power(exponent):\n    def inner(base):\n        return base ** exponent\n    return inner\n\ncube = power(3)\n# допишіть рядок, що виведе cube(2)\n',
     expected:"8"}
  ]},

  "fc-3": {title:"Функції-обʼєкти · крок 3 (зберегти у словнику)", items:[
    {type:"note", text:`Оскільки функція — це значення, її можна <b>покласти у словник</b>. Ключ — назва операції, значення — сама функція. Тоді операцію обирають за ключем: <code>operations["add"](10, 20)</code>. Так будують гнучкі «диспетчери» без довгих <code>if/elif</code>.`},
    {type:"run",
     prompt:`Словник функцій — і виклик потрібної за ключем. Запустіть.`,
     code:'def add(a, b):\n    return a + b\n\ndef multiply(a, b):\n    return a * b\n\noperations = {\n    "add": add,\n    "multiply": multiply,\n}\n\nprint(operations["add"](10, 20))\nprint(operations["multiply"](4, 5))\n'},
    {type:"task",
     prompt:`Порахуйте <code>6 * 7</code> через словник. Допишіть рядок <code>print(operations["multiply"](6, 7))</code>. Має вийти <code>42</code>.`,
     starter:'def add(a, b):\n    return a + b\n\ndef multiply(a, b):\n    return a * b\n\noperations = {"add": add, "multiply": multiply}\n# викличте множення 6 на 7 через словник operations\n',
     expected:"42"}
  ]},

  "cl-1": {title:"Замикання та каррінг · крок 1 (замикання)", items:[
    {type:"note", text:`<b>🔒 Замикання (closure)</b> — коли внутрішня функція «памʼятає» змінні зовнішньої навіть після того, як зовнішня завершилась. Зовнішня функція повертає внутрішню, а та зберігає доступ до оточення, у якому створена. Щоб <b>змінювати</b> таку змінну, потрібне слово <code>nonlocal</code>.`},
    {type:"run",
     prompt:`Внутрішня функція памʼятає <code>message</code>; а лічильник зберігає <code>count</code> між викликами. Запустіть.`,
     code:'def outer(msg):\n    message = msg\n    def inner():\n        print(message)\n    return inner\n\nmy_func = outer("Привіт із замикання!")\nmy_func()\n\ndef counter():\n    count = 0\n    def increment():\n        nonlocal count\n        count += 1\n        return count\n    return increment\n\nc = counter()\nprint(c())\nprint(c())\nprint(c())\n'},
    {type:"task",
     prompt:`Лічильник зберігає стан між викликами. Перший виклик уже був. Виведіть <b>наступне</b> значення — допишіть рядок <code>print(c())</code>. Має вийти <code>2</code>.`,
     starter:'def counter():\n    count = 0\n    def increment():\n        nonlocal count\n        count += 1\n        return count\n    return increment\n\nc = counter()\nc()\n# перший виклик уже був (не виведено). Допишіть рядок, що виведе наступне значення\n',
     expected:"2"}
  ]},

  "cl-2": {title:"Замикання та каррінг · крок 2 (каррінг)", items:[
    {type:"note", text:`<b>Каррінг</b> — коли функцію багатьох аргументів перетворюють на послідовність функцій по одному аргументу: замість <code>f(a, b)</code> — <code>f(a)(b)</code>. Так з однієї функції-знижки будують «замовлені» функції для різних відсотків.`},
    {type:"run",
     prompt:`<code>discount(10)</code> будує функцію «мінус 10%», яку далі застосовуємо до ціни. Запустіть.`,
     code:'def discount(percentage):\n    def apply(price):\n        return price * (1 - percentage / 100)\n    return apply\n\nten = discount(10)\ntwenty = discount(20)\nprint(ten(500))\nprint(twenty(500))\n\ndiscounts = {"10%": discount(10), "20%": discount(20), "30%": discount(30)}\nprint(discounts["30%"](500))\n'},
    {type:"task",
     prompt:`Створіть знижку 40% і застосуйте до ціни <code>100</code>. Функцію <code>forty = discount(40)</code> уже зроблено — допишіть рядок <code>print(forty(100))</code>. Має вийти <code>60.0</code>.`,
     starter:'def discount(percentage):\n    def apply(price):\n        return price * (1 - percentage / 100)\n    return apply\n\nforty = discount(40)\n# допишіть рядок, що виведе ціну 100 зі знижкою 40%\n',
     expected:"60.0"}
  ]},

  "dec-1": {title:"Декоратори · крок 1 (розширити без зміни коду)", items:[
    {type:"note", text:`<b>🎁 Декоратор</b> розширює поведінку функції, <b>не змінюючи її код</b>. Це функція вищого порядку: приймає функцію й повертає нову, «обгорнуту». Запис <code>func = decorator(func)</code> має зручний синтаксис <code>@decorator</code> над оголошенням функції — це те саме.`},
    {type:"run",
     prompt:`<code>@logger</code> додає логування до <code>add</code>, не чіпаючи її коду. Запустіть.`,
     code:'def logger(func):\n    def inner(x, y):\n        print("Виклик:", func.__name__, x, y)\n        result = func(x, y)\n        print("Результат:", result)\n        return result\n    return inner\n\n@logger\ndef add(x, y):\n    return x + y\n\nprint(add(2, 3))\n'},
    {type:"task",
     prompt:`Задекоруйте <code>double</code> вручну (це те саме, що <code>@announce</code>). Впишіть замість <code>______</code> вираз <code>announce(double)</code>. Має вийти <code>Виклик!</code> і <code>10</code>.`,
     starter:'def announce(func):\n    def inner(x):\n        print("Виклик!")\n        return func(x)\n    return inner\n\ndef double(x):\n    return x * 2\n\ndouble = ______\nprint(double(5))\n',
     expected:"Виклик!\n10"}
  ]},

  "dec-2": {title:"Декоратори · крок 2 (functools.wraps)", items:[
    {type:"note", text:`Обгортаючи функцію, декоратор ненавмисно «підміняє» її метадані: <code>__name__</code> став би <code>inner</code>. Щоб цього не сталося, на внутрішню функцію вішають <code>@wraps(func)</code> з модуля <code>functools</code> — і оригінальні імʼя та документація зберігаються.`},
    {type:"run",
     prompt:`Завдяки <code>@wraps(func)</code> імʼя функції лишається правильним. Запустіть.`,
     code:'from functools import wraps\n\ndef logger(func):\n    @wraps(func)\n    def inner(x, y):\n        return func(x, y)\n    return inner\n\n@logger\ndef add(x, y):\n    return x + y\n\nprint(add(2, 3))\nprint("Назва функції:", add.__name__)\n'},
    {type:"mcq", q:`Навіщо у декораторі використовують <code>functools.wraps</code>?`,
     opts:["Щоб декоратор працював помітно швидше за звичайний","Щоб дозволити застосувати кілька декораторів одночасно","Щоб зберегти метадані оригінальної функції (напр. __name__)"], answer:"Щоб зберегти метадані оригінальної функції (напр. __name__)",
     expl:`Без <code>wraps</code> обгорнута функція «представлялась» би як <code>inner</code>. <code>wraps</code> копіює імʼя, докстрінг тощо від оригіналу.`}
  ]},

  "comp-1": {title:"Comprehensions · крок 1 (list)", items:[
    {type:"note", text:`<b>⚡ List comprehension</b> створює список одним виразом замість циклу: <code>[вираз for x in послідовність if умова]</code>. Коротше, читабельніше й часто швидше за <code>for</code> з <code>append</code>.`},

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 8 — елементи функціонального програмування",
  intro:`Тут ви опановуєте функціональний стиль Python: функції як обʼєкти першого класу (передавати, повертати, зберігати), <b>замикання</b> та <b>каррінг</b>, <b>декоратори</b> для розширення поведінки без зміни коду, компактні <b>comprehensions</b> і вбудовані <code>lambda</code>, <code>map</code>, <code>filter</code>, <code>any</code>, <code>all</code>. Усе запускається прямо тут — пробуйте руками.`,
  groups:[
    {name:"🧩 Функція як обʼєкт першого класу", desc:`Функцію можна присвоїти змінній, передати як аргумент, повернути з іншої функції та зберегти у словнику — на прикладі «калькулятора операцій».`, blocks:["fc-1","fc-2","fc-3"]},
    {name:"🔒 Замикання та каррінг", desc:`Замикання (внутрішня функція памʼятає оточення, <code>nonlocal</code>) і каррінг (<code>f(a)(b)</code>) — на прикладі лічильника викликів і функцій знижок.`, blocks:["cl-1","cl-2"]},
    {name:"🎁 Декоратори", desc:`Розширення поведінки функції без зміни її коду через <code>@decorator</code>, і <code>functools.wraps</code> для збереження метаданих.`, blocks:["dec-1","dec-2"]},
    {name:"⚡ Comprehensions", desc:`Компактне створення списків, множин і словників одним виразом (<code>[...]</code>, <code>{...}</code>) з умовою <code>if</code>.`, blocks:["comp-1","comp-2"]},
    {name:"λ Функціональні інструменти", desc:`<code>lambda</code>, <code>map</code>, <code>filter</code>, <code>any</code> та <code>all</code> — короткий і виразний код для обробки колекцій.`, blocks:["fn-1","fn-2","fn-3"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки (порожній <code>all</code>, ітератори, замикання, <code>lambda</code>) та короткі ідіоми. Необовʼязково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
</script>

  var h=document.documentElement;
  function upd(){
    var se=h.scrollHeight-h.clientHeight;
    var p=se>0?(h.scrollTop||document.body.scrollTop)/se:0;
    if(p<0)p=0; if(p>1)p=1;
    f.style.width=(p*100).toFixed(2)+"%";
  }
  addEventListener("scroll",upd,{passive:true});
  addEventListener("resize",upd);
  setTimeout(upd,60); setTimeout(upd,700); upd();
})();
</script>
