<script>
const BLOCKS = {
  "gs-1": {title:"__dict__ — словник атрибутів обʼєкта", items:[
    {type:"note", text:`<b>🗂 <code>__dict__</code></b> — спеціальний атрибут екземпляра: словник з <b>усіма його полями</b> (ключі — імена атрибутів, значення — їхні значення). Python створює його автоматично. Через нього можна навіть динамічно додавати чи видаляти атрибути — саме на <code>__dict__</code> спираються методи керування серіалізацією.`},
    {type:"run",
     prompt:`Дивимось <code>__dict__</code> і динамічно змінюємо його. Запустіть.`,
     code:'class Example:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\nobj = Example("Gupalo Vasyl", 30)\nprint(obj.__dict__)\n\nobj.__dict__["city"] = "Poltava"\nprint(obj.city)\n\ndel obj.__dict__["age"]\nprint(obj.__dict__)\n'},
    {type:"task",
     prompt:`Дістаньте значення поля <code>"name"</code> зі словника атрибутів. Допишіть <code>print(c.__dict__["name"])</code>. Має вийти <code>Simon</code>.`,
     starter:'class Cat:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\nc = Cat("Simon", 3)\n# виведіть значення "name" зі словника атрибутів\n',
     expected:"Simon"}
  ]},

  "gs-2": {title:"__getstate__ / __setstate__ · вибіркова серіалізація", items:[
    {type:"note", text:`<b>🎛 Керування пакуванням.</b> Перед серіалізацією <code>pickle</code> шукає <code>__getstate__</code> — той повертає <b>стан</b> (зазвичай словник), який і буде збережено. Під час розпакування викликається <code>__setstate__(state)</code>, який <b>відновлює</b> обʼєкт. Так можна <b>не зберігати</b> частину полів і задавати їм типові значення при відновленні.`},
    {type:"run",
     prompt:`<code>Robot</code> навмисно не зберігає поле <code>is_active</code>, а <code>__setstate__</code> повертає йому типове значення. Запустіть.`,
     code:'import pickle\n\nclass Robot:\n    def __init__(self, name, battery_life):\n        self.name = name\n        self.battery_life = battery_life\n        self.is_active = False\n\n    def __getstate__(self):\n        state = dict(self.__dict__)\n        del state["is_active"]\n        return state\n\n    def __setstate__(self, state):\n        self.__dict__.update(state)\n        self.is_active = False\n\nrobot = Robot("Robo1", 100)\nrestored = pickle.loads(pickle.dumps(robot))\nprint(restored.__dict__)\n'},
    {type:"task",
     prompt:`<code>Session</code> не серіалізує <code>token</code>, а при відновленні ставить його в <code>"none"</code>. Виведіть <code>token</code> відновленого обʼєкта: допишіть <code>print(s.token)</code>. Має вийти <code>none</code>.`,
     starter:'import pickle\n\nclass Session:\n    def __init__(self, user, token):\n        self.user = user\n        self.token = token\n\n    def __getstate__(self):\n        state = dict(self.__dict__)\n        del state["token"]\n        return state\n\n    def __setstate__(self, state):\n        self.__dict__.update(state)\n        self.token = "none"\n\ns = pickle.loads(pickle.dumps(Session("Bob", "secret123")))\n# виведіть token відновленого обʼєкта\n',
     expected:"none"}
  ]},

  "gs-3": {title:"Несеріалізовані атрибути (файли, зʼєднання)", items:[
    {type:"note", text:`Деякі атрибути <b>не можна</b> серіалізувати — відкритий файл, зʼєднання з БД, системний ресурс (вони живуть поза Python). Спроба спакувати такий обʼєкт дає <code>TypeError</code>. Рішення: у <code>__getstate__</code> <b>виключити</b> проблемний атрибут (напр. <code>fh=None</code>), а в <code>__setstate__</code> — <b>відтворити</b> ресурс (знову відкрити файл за збереженим імʼям).`},
    {type:"run",
     prompt:`<code>Reader</code> тримає відкритий файл. Завдяки <code>__getstate__</code>/<code>__setstate__</code> він пакується й розпаковується без помилок. Запустіть.`,
     code:'import pickle\n\nwith open("data.txt", "w", encoding="utf-8") as f:\n    f.write("Message from file")\n\nclass Reader:\n    def __init__(self, filename):\n        self.filename = filename\n        self.fh = open(self.filename, "r", encoding="utf-8")\n\n    def read(self):\n        return self.fh.read()\n\n    def __getstate__(self):\n        return {**self.__dict__, "fh": None}\n\n    def __setstate__(self, state):\n        self.__dict__ = state\n        self.fh = open(state["filename"], "r", encoding="utf-8")\n\nreader = Reader("data.txt")\nblob = pickle.dumps(reader)\nloaded = pickle.loads(blob)\nprint(loaded.read())\n'},
    {type:"mcq", q:`Чому відкритий файловий дескриптор (<code>self.fh</code>) не можна серіалізувати через <code>pickle</code>?`,
     opts:["він повʼязаний із зовнішнім системним ресурсом, який pickle не може зберегти й відновити","файли завжди надто великі","pickle взагалі не працює з класами"], answer:"він повʼязаний із зовнішнім системним ресурсом, який pickle не може зберегти й відновити",
     expl:`Файл — це посилання на ресурс ОС. Тому його виключають зі стану (<code>fh=None</code>) і відкривають наново у <code>__setstate__</code>.`}
  ]},

  "cp-1": {title:"Псевдонім чи копія?", items:[
    {type:"note", text:`<b>⚠️ Присвоєння не копіює.</b> <code>b = a</code> не створює новий обʼєкт — це лише <b>ще одне імʼя</b> для того самого. Тому зміна через одне імʼя видно й через інше. Особливо підступно, коли змінюваний обʼєкт (список, словник) передають у функцію, і вона його мутує.`},
    {type:"run",
     prompt:`Псевдонім списку і функція, що мутує аргумент. Запустіть — і зверніть увагу, що оригінали змінюються.`,
     code:'my_list = [1, 2, 3]\ncopy_list = my_list\ncopy_list.append(4)\nprint(my_list)\n\ndef square_list(x):\n    for i, el in enumerate(x):\n        x[i] = el ** 2\n    return x\n\nnums = [1, 2, 3]\nsquare_list(nums)\nprint(nums)\n'},
    {type:"mcq", q:`Що робить <code>copy_list = my_list</code> для списку?`,
     opts:["створює новий псевдонім того самого списку (обидва імені — на один обʼєкт)","створює незалежну копію","створює глибоку копію"], answer:"створює новий псевдонім того самого списку (обидва імені — на один обʼєкт)",
     expl:`Це просто друге імʼя. Щоб отримати незалежний обʼєкт, потрібне явне копіювання (<code>[:]</code>, <code>{**d}</code> або <code>copy</code>).`}
  ]},

  "cp-2": {title:"Поверхнева копія (copy.copy)", items:[
    {type:"note", text:`<b>🪞 Поверхнева копія</b> створює новий обʼєкт, але <b>вкладені</b> обʼєкти лишаються <b>спільними</b> (копіюються лише посилання на них). Для простих структур зручні <code>list[:]</code> та <code>{**d}</code>; для загального випадку — <code>copy.copy</code>. Якщо вкладеності немає — цього достатньо.`},
    {type:"run",
     prompt:`Верхній рівень — новий, але вкладений словник спільний: зміна видно в обох. Запустіть.`,
     code:'import copy\n\nmy_list = [1, 2, {"name": "Vasyl"}]\ncopy_list = copy.copy(my_list)\ncopy_list[2]["age"] = 30\nprint(my_list)\nprint(copy_list)\n'},
    {type:"task",
     prompt:`Зріз <code>[:]</code> робить незалежний верхній рівень. Додайте <code>4</code> до копії й виведіть <b>оригінал</b> (він не має змінитися): допишіть <code>print(my_list)</code>. Має вийти <code>[1, 2, 3]</code>.`,
     starter:'my_list = [1, 2, 3]\ncopy_list = my_list[:]\ncopy_list.append(4)\n# виведіть оригінальний my_list (без 4)\n',
     expected:"[1, 2, 3]"}
  ]},

  "cp-3": {title:"Глибока копія (copy.deepcopy)", items:[
    {type:"note", text:`<b>🌊 Глибока копія</b> (<code>copy.deepcopy</code>) рекурсивно копіює обʼєкт <b>і всі вкладені</b> — результат повністю незалежний від оригіналу. Це те, чого бракує поверхневій копії, коли структура має вкладені змінювані обʼєкти.`},
    {type:"run",
     prompt:`Той самий сценарій, але з <code>deepcopy</code>: зміна вкладеного словника в копії <b>не чіпає</b> оригінал. Запустіть.`,
     code:'import copy\n\nmy_list = [1, 2, {"name": "Vasyl"}]\ncopy_list = copy.deepcopy(my_list)\ncopy_list[2]["age"] = 30\nprint(my_list)\nprint(copy_list)\n'},
    {type:"task",
     prompt:`Глибока копія незалежна навіть у вкладеному списку. Додайте <code>99</code> до <code>clone["nums"]</code> і виведіть <b>оригінал</b> <code>data["nums"]</code>: допишіть <code>print(data["nums"])</code>. Має вийти <code>[1, 2, 3]</code>.`,
     starter:'import copy\n\ndata = {"nums": [1, 2, 3]}\nclone = copy.deepcopy(data)\nclone["nums"].append(99)\n# виведіть оригінальний data["nums"] (без 99)\n',
     expected:"[1, 2, 3]"}
  ]},

  "cp-4": {title:"__copy__ / __deepcopy__ (+ memo)", items:[
    {type:"note", text:`<b>🎚 Керування копіюванням.</b> Для власних класів можна задати <code>__copy__</code> (поверхнева копія) і <code>__deepcopy__(self, memo)</code> (глибока) — <code>copy.copy</code>/<code>copy.deepcopy</code> викличуть саме їх. Аргумент <code>memo</code> — словник уже скопійованих обʼєктів (за <code>id</code>): захищає від дублювання й <b>нескінченної рекурсії</b> при циклічних посиланнях.`},
    {type:"run",

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">🔒 Код виконується у вашому браузері — нічого не надсилається. Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
</script>
<script>
(function(){
  var f=document.querySelector(".snakeprog .fill"); if(!f) return;
  var h=document.documentElement;
  function upd(){
    var se=h.scrollHeight-h.clientHeight;
    var p=se>0?(h.scrollTop||document.body.scrollTop)/se:0;
    if(p<0)p=0; if(p>1)p=1;
    f.style.width=(p*100).toFixed(2)+"%";
  }
  addEventListener("scroll",upd,{passive:true});
  addEventListener("resize",upd);
  setTimeout(upd,60); setTimeout(upd,700); upd();
})();
</script>
<script>(function(){var b=document.getElementById("themeToggle"),r=document.documentElement;if(b)b.addEventListener("click",function(){var n=r.getAttribute("data-theme")==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("pf-theme",n);}catch(e){}});})();</script>
