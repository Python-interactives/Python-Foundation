<script>
const BLOCKS = {
  "imp-1": {title:"Аналізатор температур · крок 1 (import зі стандартної бібліотеки)", items:[
    {type:"note", text:`<b>🌡 Будуємо аналізатор температур.</b> Замість писати все з нуля — підключаємо готове зі <b>стандартної бібліотеки</b>. <code>import</code> завантажує цілий модуль (тоді звертаємось <code>модуль.функція</code>), а <code>from ... import ...</code> бере лише потрібне.<br><br><b>З теми:</b> модуль — це файл із кодом, а пакет — тека з модулями. Стандартна бібліотека Python дає багато таких модулів «з коробки».`},
    {type:"run",
     prompt:`Підключаємо <code>statistics</code> та вбудовані <code>min</code>/<code>max</code> — і рахуємо показники. Запустіть, потім змініть числа й запустіть ще раз.`,
     code:'import statistics\n\ntemps = [22.5, 23.1, 21.8, 24.1]\nprint("Середня:", round(statistics.mean(temps), 2))\nprint("Максимум:", max(temps))\n'},
    {type:"task",
     prompt:`Виведіть <b>медіану</b> списку. Допишіть рядок <code>print(statistics.median(temps))</code>. Для <code>[21.0, 23.0, 25.0]</code> має вийти <code>23.0</code>.`,
     starter:'import statistics\n\ntemps = [21.0, 23.0, 25.0]\n# допишіть рядок, що виведе медіану списку temps\n',
     expected:"23.0"}
  ]},

  "imp-2": {title:"Аналізатор температур · крок 2 (псевдонім as)", items:[
    {type:"note", text:`<b>З теми.</b> Псевдонім <code>as</code> дає модулю чи функції коротше або зручніше ім'я: <code>import statistics as st</code>, далі <code>st.mean(...)</code>. Навіщо: уникнути конфлікту імен, скоротити довгі назви, легко підмінити модуль на схожий — змінивши лише рядок імпорту.`},
    {type:"run",
     prompt:`Той самий модуль, але під коротким ім'ям <code>st</code>. Запустіть.`,
     code:'import statistics as st\n\ntemps = [22.5, 23.1, 21.8]\nprint("mean:", round(st.mean(temps), 2))\n'},
    {type:"task",
     prompt:`Імпортуйте <code>sqrt</code> із <code>math</code> під ім'ям <code>root</code> і виведіть корінь зі 144. Допишіть рядок <code>print(root(144))</code>. Має вийти <code>12.0</code>.`,
     starter:'from math import sqrt as root\n\n# допишіть рядок, що виведе корінь зі 144 через root\n',
     expected:"12.0"}
  ]},

  "dry-1": {title:"Аналізатор температур · крок 3 (DRY: винести у функцію)", items:[
    {type:"note", text:`<b>Принцип DRY</b> (Don't Repeat Yourself): якщо однакова логіка повторюється — винесіть її у функцію. Тоді зміна робиться в одному місці, а не в десятьох. Функцію потім легко перенести в окремий модуль і імпортувати.`},
    {type:"run",
     prompt:`Логіку аналізу зібрали в одну функцію <code>analyze</code> — і викликаємо її для різних списків. Запустіть.`,
     code:'import statistics\n\ndef analyze(temps):\n    return {\n        "min": min(temps),\n        "max": max(temps),\n        "avg": round(statistics.mean(temps), 2),\n    }\n\nprint(analyze([22.5, 23.1, 21.8]))\nprint(analyze([18.0, 19.5, 20.0]))\n'},
    {type:"task",
     prompt:`Допишіть тіло функції: поверніть середнє, округлене до 1 знаку — <code>return round(statistics.mean(temps), 1)</code>. Для <code>[10, 20, 30]</code> має вийти <code>20.0</code>.`,
     starter:'import statistics\n\ndef analyze(temps):\n    # поверніть середнє, округлене до 1 знаку\n    ______\n\nprint(analyze([10, 20, 30]))\n',
     expected:"20.0"}
  ]},

  "temp-final": {title:"Аналізатор температур · фінал (файл + main)", items:[
    {type:"note", text:`<b>Збираємо все разом.</b> Дані читаємо з файлу, чистимо порожні рядки, рахуємо показники — і запускаємо через <b>точку входу</b> <code>main()</code> під захистом <code>if __name__ == "__main__"</code>. Цей рядок гарантує, що <code>main()</code> запуститься лише коли файл викликають напряму, а не коли його імпортують як модуль.<br><br>🔗 <b>У фінальному проєкті</b> код так само розкладають на модулі (окремо читання даних, окремо логіка, окремо <code>main.py</code>) — це і є хороша структура проєкту.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — файл <code>temperatures.txt</code> створиться, прочитається й проаналізується. Додайте свої значення в <code>f.write(...)</code> і запустіть ще раз. 🌡`,
     code:'import statistics\n\ndef load(name):\n    with open(name, "r", encoding="utf-8") as f:\n        return f.readlines()\n\ndef clean(rows):\n    return [float(r.strip()) for r in rows if r.strip()]\n\ndef main():\n    with open("temperatures.txt", "w", encoding="utf-8") as f:\n        f.write("22.5\\n23.1\\n\\n21.8\\n24.1\\n")\n    temps = clean(load("temperatures.txt"))\n    print("Днів з даними:", len(temps))\n    print("Мінімум:", min(temps))\n    print("Максимум:", max(temps))\n    print("Медіана:", statistics.median(temps))\n\nif __name__ == "__main__":\n    main()\n'},
    {type:"note", text:`<details style="margin:0"><summary style="cursor:pointer;font-weight:600">🎯 Де це у твоєму напрямку <span style="opacity:.6;font-weight:400">(можна розгорнути або пропустити)</span></summary><div style="margin-top:8px;line-height:1.6"><b>AI&amp;ML.</b> Проєкти діляться на модулі: підготовка даних, навчання, оцінка; сторонні пакети (numpy, pandas) ставлять у venv.<br><b>SE&amp;AI.</b> Структура пакетів, точка входу й <code>requirements.txt</code> — щоденна основа будь-якого сервісу.<br><b>CyberSec&amp;AI.</b> Ізоляція залежностей у venv і фіксація версій — це ще й про відтворюваність і безпеку ланцюжка постачання.<br><b>PM&amp;AI.</b> Розуміння структури проєкту й залежностей допомагає оцінювати обсяг і ризики роботи команди.</div></details>`}
  ]},

  "pkg-1": {title:"Модулі та пакети · що є що", items:[
    {type:"note", text:`<b>Модуль</b> — це один файл <code>.py</code> з кодом. <b>Пакет</b> — це тека з модулями (і зазвичай службовим файлом <code>__init__.py</code>). Розкладаючи модулі по теках, ви структуруєте проєкт, і потрібний код легше знайти.`},
    {type:"classify",
     prompt:`Позначте те, що є <b>пакетом</b> (тека з модулями), а не окремим модулем:`,
     items:[
       {label:"math.py", correct:false, note:"це модуль — окремий файл .py"},
       {label:"calculations/ (тека з файлами)", correct:true},
       {label:"utils.py", correct:false, note:"теж модуль, один файл"},
       {label:"joke/ з __init__.py", correct:true}
     ]},
    {type:"mcq", q:`Який файл історично робив теку <b>пакетом</b> (щоб з неї можна було імпортувати)?`,
     opts:["__init__.py","package.json","main.py"], answer:"__init__.py",
     expl:`До Python 3.3 тека без <code>__init__.py</code> не вважалася пакетом. Зараз не обов'язково, але файл часто лишають для сумісності та зручних імпортів (через <code>__all__</code>).`}
  ]},

  "pkg-2": {title:"Як Python шукає модулі · пастка імен", items:[
    {type:"note", text:`<b>Порядок пошуку.</b> Коли ви пишете <code>import щось</code>, Python шукає модуль так: спершу в директорії запуску (робочій), потім у шляхах зі змінної оточення <code>PYTHONPATH</code>, і нарешті у стандартних теках, куди встановлено Python. <b>Перший збіг перемагає.</b>`},
    {type:"mcq", q:`Ви назвали свій файл <code>random.py</code> і в ньому написали <code>import random</code>. Що імпортується?`,
     opts:["Ваш файл random.py","Стандартна бібліотека random","Помилка імпорту"], answer:"Ваш файл random.py",
     expl:`Робоча директорія переглядається ПЕРШОЮ, тож ваш <code>random.py</code> перекриє стандартний модуль. Тому не називайте файли іменами стандартних модулів.`},
    {type:"mcq", q:`Чому не радять <code>from module import *</code>?`,
     opts:["Можливі конфлікти імен і гірша читабельність","Це помітно вповільнює роботу програми","Це завжди призводить до синтаксичної помилки"], answer:"Можливі конфлікти імен і гірша читабельність",
     expl:`Зірочка тягне у ваш простір імен усе підряд — легко випадково перекрити свою змінну й важче зрозуміти, звідки взялося ім'я. Що саме віддає зірочка, регулює список <code>__all__</code>.`}
  ]},

  "pkg-3": {title:"pip, venv і requirements.txt", items:[
    {type:"note", text:`<b>pip</b> ставить сторонні пакети з <a href="https://pypi.org/" target="_blank" rel="noopener">PyPI</a>. Ставити їх глобально — погана ідея: пакети різних проєктів конфліктують. Тому кожному проєкту роблять <b>віртуальне оточення</b> (<code>venv</code>) — ізольовану теку із власним Python і пакетами. А <code>requirements.txt</code> фіксує список залежностей із версіями.`},
    {type:"mcq", q:`Що робить команда <code>pip freeze > requirements.txt</code>?`,

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 6 — модулі, пакети та віртуальне оточення",
  intro:`Тут ви структуруєте код: розбиваєте великий файл на модулі й пакети, підключаєте готове зі стандартної бібліотеки та ізолюєте залежності у віртуальному оточенні. Спершу зберемо аналізатор температур — з <code>import</code>, псевдонімами (<code>as</code>), принципом DRY і точкою входу <code>main</code>. Далі розберемо, як влаштовані пакети, <code>__init__.py</code>, пошук модулів, <code>pip</code> і <code>venv</code>.`,
  groups:[
    {name:"🌡 Кейс · Аналізатор температур", desc:`Підключаємо стандартну бібліотеку (<code>math</code>, <code>statistics</code>), даємо псевдоніми, виносимо логіку у функції (DRY) і додаємо точку входу <code>main</code> з <code>if __name__ == "__main__"</code>. У фіналі — читання з файлу.`, blocks:["imp-1","imp-2","dry-1","temp-final"]},
    {name:"📦 Модулі, пакети, оточення", desc:`Як влаштовано структуру: модуль-файл vs пакет-тека, службовий <code>__init__.py</code>, порядок пошуку модулів і навіщо <code>pip</code>, <code>venv</code> та <code>requirements.txt</code>.`, blocks:["pkg-1","pkg-2","pkg-3"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки з імпортами й аргументами та ідіоми KISS. Необов'язково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
