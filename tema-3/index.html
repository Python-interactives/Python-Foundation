<style>
  :root{
    --bg:#0D1117;--panel:#161B22;--panel2:#1C2330;--border:#30363D;
    --white:#F0F6FC;--muted:#8B949E;--green:#3FB950;--greenbg:#11331c;

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.6;font-size:15px}

  textarea{width:100%;min-height:120px;background:#07090e;color:#c9d1d9;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:"SF Mono",Consolas,monospace;font-size:14px;resize:vertical}

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .fb{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px;display:none;white-space:pre-wrap}
  .fb.show{display:block}.fb.ok{background:var(--greenbg);border:1px solid var(--green)}.fb.no{background:var(--redbg);border:1px solid var(--red)}
  .btn{background:var(--green);color:#031b0c;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}

  .idx a{display:block;padding:6px 0;border-bottom:1px solid var(--border)}
</style>

<script>
const BLOCKS = {
  "dt-1": {title:"Дедлайни та події · крок 1 (поточна дата)", items:[
    {type:"note", text:`<b>📅 Будуємо міні-планувальник подій.</b> Тут працюємо з датами й часом. <code>datetime</code> — вбудований модуль: об'єкт дати «знає» свій рік, місяць, день, годину тощо.`},
    {type:"run",
     prompt:`<code>datetime.now()</code> дає поточний момент, а з нього можна дістати окремі частини. Запустіть — час справжній, ваш. Натисніть ще раз за хвилину: секунди зміняться.`,
     code:'from datetime import datetime\nnow = datetime.now()\nprint("Зараз:", now)\nprint("Рік:", now.year)\nprint("Місяць:", now.month)\nprint("День:", now.day)\nprint("Година:", now.hour)\n'},
    {type:"task",
     prompt:`Мета — вивести, о котрій <b>годині</b> починається подія (має бути <code>18</code>). У коді нижче замість <code>______</code> впишіть <code>hour</code>: після крапки так дістають будь-яку частину дати — <code>event.year</code>, <code>event.day</code>, <code>event.hour</code>.`,
     starter:'from datetime import datetime\nevent = datetime(2026, 9, 1, 18, 30)\nprint(event.______)\n',
     expected:"18"}
  ]},

  "dt-2": {title:"Дедлайни та події · крок 2 (день тижня, формат)", items:[
    {type:"note", text:`<b>З теми.</b> <code>weekday()</code> повертає номер дня тижня (понеділок = 0 … неділя = 6). Щоб показати назву українською, цей номер беруть як індекс у власному списку назв. А <code>strftime</code> робить з дати гарний рядок за шаблоном (<code>%d</code> — день, <code>%m</code> — місяць, <code>%Y</code> — рік).`},
    {type:"run",
     prompt:`Дізнаємось про подію більше: який це день тижня і як гарно показати дату. Запустіть; поміняйте дату й подивіться, як зміниться день тижня.`,
     code:'from datetime import datetime\nDAYS = ["понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота", "неділя"]\nevent = datetime(2026, 9, 1)\nprint("День тижня:", DAYS[event.weekday()])\nprint("Дата:", event.strftime("%d.%m.%Y"))\n'},
    {type:"task",
     prompt:`Мета — показати дату як <code>31.12.2026</code> (формат ДД.ММ.РРРР). У коді нижче замість <code>______</code> впишіть шаблон <code>"%d.%m.%Y"</code> — <code>strftime</code> підставить у нього день, місяць і рік. Очікуваний вивід: <code>31.12.2026</code>.`,
     starter:'from datetime import datetime\nevent = datetime(2026, 12, 31)\nprint(event.strftime(______))\n',
     expected:"31.12.2026"}
  ]},

  "dt-3": {title:"Дедлайни та події · крок 3 (timedelta)", items:[
    {type:"note", text:`<b>З теми.</b> Віднімеш одну дату від іншої — отримаєш <code>timedelta</code> (проміжок), у якого є <code>.days</code>. А додаси <code>timedelta</code> до дати — зсунеш її вперед.`},
    {type:"run",
     prompt:`Скільки днів лишилось до дедлайну і яка дата буде через 10 днів. «Сьогодні» тут фіксоване, щоб результат був сталим. Запустіть; посуньте дедлайн і подивіться.`,
     code:'from datetime import datetime, timedelta\ntoday = datetime(2026, 7, 17)\ndeadline = datetime(2026, 9, 1)\nleft = deadline - today\nprint("Днів до дедлайну:", left.days)\nprint("Дата через 10 днів:", today + timedelta(days=10))\n'},
    {type:"task",
     prompt:`Мета — порахувати, скільки <b>днів</b> між датами (має бути <code>59</code>). Різниця <code>end - start</code> — це <code>timedelta</code>; замість <code>______</code> впишіть <code>days</code>, тобто вийде <code>(end - start).days</code>.`,
     starter:'from datetime import datetime\nstart = datetime(2026, 1, 1)\nend = datetime(2026, 3, 1)\nprint((end - start).______)\n',
     expected:"59"}
  ]},

  "dt-4": {title:"Дедлайни та події · крок 4 (розбір рядка)", items:[
    {type:"note", text:`<b>З теми.</b> Дати часто приходять <i>рядком</i> — із форми, бази, вебсторінки. <code>strptime</code> робить зі рядка справжній <code>datetime</code> за шаблоном (той самий синтаксис, що й у <code>strftime</code>).`},
    {type:"run",
     prompt:`Перетворюємо рядок «2026.09.01» на об'єкт дати — і одразу можемо спитати його день тижня. Запустіть.`,
     code:'from datetime import datetime\ndate_string = "2026.09.01"\nevent = datetime.strptime(date_string, "%Y.%m.%d")\nprint(event)\nprint("День тижня (0=пн):", event.weekday())\n'},
    {type:"task",
     prompt:`Мета — розібрати рядок <code>"31/12/2026"</code> і вивести рік (має бути <code>2026</code>). Замість <code>______</code> впишіть шаблон у лапках під формат <b>ДД/ММ/РРРР</b> — зберіть його з кодів <code>%d</code> (день), <code>%m</code> (місяць), <code>%Y</code> (рік), поставивши між ними <code>/</code>.`,
     starter:'from datetime import datetime\ndate_string = "31/12/2026"\nevent = datetime.strptime(date_string, ______)\nprint(event.year)\n',
     expected:"2026"}
  ]},

  "dt-final": {title:"Дедлайни та події · фінал", items:[
    {type:"note", text:`<b>Збираємо планувальник.</b> По події показуємо гарну дату, день тижня і скільки днів лишилось — усе, що навчились, разом.<br><br>🔗 <b>У фінальному проєкті</b> ви даси нотаткам дату нагадування й рахуватимеш, скільки днів лишилось — саме ця механіка.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — ось зведення по події. Поміняйте <code>event</code> на свою дату (день народження, дедлайн, поїздку) і подивіться. 📅`,
     code:'from datetime import datetime\nDAYS = ["понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота", "неділя"]\ntoday = datetime(2026, 7, 17)\nevent = datetime(2026, 9, 1)\nleft = (event - today).days\ndate_str = event.strftime("%d.%m.%Y")\nweekday = DAYS[event.weekday()]\nprint(f"Подія: {date_str} ({weekday})")\nprint(f"Днів лишилось: {left}")\n'}
  ]},

  "rnd-1": {title:"Розіграш призів · крок 1 (випадкове число)", items:[
    {type:"note", text:`<b>🎲 Робимо розіграш призів.</b> <code>random</code> — модуль для випадковості. <code>randint(a, b)</code> дає випадкове ціле від <code>a</code> до <code>b</code> включно.`},
    {type:"run",
     prompt:`Кожному учаснику — щасливе число (кубик 1–6). Запустіть кілька разів поспіль: щоразу інше — це і є випадковість.`,
     code:'import random\ndice = random.randint(1, 6)\nprint("Випало:", dice)\n'},
    {type:"task",
     prompt:`Кубик завжди в межах 1–6. Допишіть рядок <code>print(1 &lt;= dice &lt;= 6)</code> — він це перевіряє й виводить <code>True</code>. Хоч число щоразу різне, результат перевірки завжди <code>True</code>.`,
     starter:'import random\ndice = random.randint(1, 6)\n# допишіть рядок, що виведе True, якщо dice у межах 1..6\n',
     expected:"True"}
  ]},

  "rnd-2": {title:"Розіграш призів · крок 2 (перемішати, обрати одного)", items:[
    {type:"note", text:`<b>З теми.</b> <code>shuffle</code> перемішує список на місці, а <code>choice</code> дістає з нього один випадковий елемент.`},
    {type:"run",
     prompt:`Спершу перемішаймо учасників розіграшу. Запустіть — порядок щоразу новий.`,
     code:'import random\nparticipants = ["Анна", "Богдан", "Віктор", "Галина", "Дмитро", "Олена"]\nrandom.shuffle(participants)\nprint("Перемішали:", participants)\n'},
    {type:"run",
     prompt:`А тепер витягнемо одного переможця. Запускайте — щоразу може випасти інший.`,
     code:'import random\nparticipants = ["Анна", "Богдан", "Віктор", "Галина", "Дмитро", "Олена"]\nwinner = random.choice(participants)\nprint("Переможець:", winner)\n'}
  ]},

  "rnd-3": {title:"Розіграш призів · крок 3 (кілька переможців)", items:[
    {type:"note", text:`<b>З теми.</b> <code>sample(список, k)</code> дістає <code>k</code> <b>різних</b> елементів (без повторів) — саме те, щоб обрати кількох переможців.`},
    {type:"run",
     prompt:`Оберемо трьох переможців — усі різні. Запустіть кілька разів.`,
     code:'import random\nparticipants = ["Анна", "Богдан", "Віктор", "Галина", "Дмитро", "Олена"]\nwinners = random.sample(participants, 3)\nprint("Переможці:", winners)\n'},
    {type:"task",
     prompt:`Скільки переможців у списку? Допишіть рядок <code>print(len(winners))</code>. Самі переможці щоразу різні, але їх завжди <b>3</b> — тому результат сталий.`,
     starter:'import random\nparticipants = ["Анна", "Богдан", "Віктор", "Галина", "Дмитро", "Олена"]\nwinners = random.sample(participants, 3)\n# допишіть рядок, що виведе, скільки переможців\n',
     expected:"3"}
  ]},

  "rnd-4": {title:"Розіграш призів · крок 4 (різні шанси)", items:[
    {type:"note", text:`<b>З теми.</b> <code>choices(список, weights, k=...)</code> — вибір із <b>вагами</b>: що більша вага, то частіше елемент випадає (повтори дозволені).`},
    {type:"run",
     prompt:`Призи мають різні шанси: стікер (вага 6) випадає найчастіше, головний приз (вага 1) — найрідше. Запустіть кілька разів і порівняйте, чого випадає більше.`,
     code:'import random\nprizes = ["головний приз", "знижка", "стікер"]\nweights = [1, 3, 6]\ndraw = random.choices(prizes, weights, k=5)\nprint("Розіграно:", draw)\n'}
  ]},

  "rnd-5": {title:"Розіграш призів · крок 5 (поділ призу, округлення)", items:[
    {type:"note", text:`<b>Трохи математики.</b> Приз ділять між переможцями, а результат округлюють до цілих гривень: <code>math.floor</code> — вниз, <code>math.ceil</code> — вгору.`},
    {type:"run",
     prompt:`Ділимо приз <code>1000</code> грн між <code>3</code> переможцями. Ділення дає дріб — тож округлюємо. Запустіть.`,
     code:'import math\nprize = 1000 / 3\nprint("Точно:", prize)\nprint("Вниз (floor):", math.floor(prize))\nprint("Вгору (ceil):", math.ceil(prize))\n'},
    {type:"task",
     prompt:`Приз <code>1000</code> грн ділимо порівну між <code>3</code> переможцями й округлюємо <b>вниз</b>. Допишіть рядок <code>print(math.floor(1000 / 3))</code>. Має вийти <code>333</code>.`,
     starter:'import math\n# приз 1000 грн порівну на 3 переможців, округлити вниз до цілого\n',
     expected:"333"}
  ]},

  "rnd-6": {title:"Розіграш призів · крок 6 (чесне порівняння дійсних)", items:[
    {type:"note", text:`<b>Тонкий момент — на майбутнє, не лякайтесь.</b> Комп'ютер зберігає дроби неточно, тож <code>0.1 + 0.2</code> не дорівнює рівно <code>0.3</code>. Саме тому дійсні числа порівнюють не через <code>==</code>, а через <code>math.isclose</code>.`},
    {type:"run",
     prompt:`Запустіть — і побачите пастку та чесний спосіб її обійти.`,
     code:'import math\nprint("0.1 + 0.2 == 0.3 ?", 0.1 + 0.2 == 0.3)\nprint("а через isclose:", math.isclose(0.1 + 0.2, 0.3))\n'}
  ]},

  "rnd-final": {title:"Розіграш призів · фінал", items:[
    {type:"note", text:`<b>Повний розіграш.</b> Перемішуємо учасників, чесно тягнемо переможців і оголошуємо — усе разом.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — проведемо розіграш. Додайте своє ім'я в список і зловіть удачу. 🎲`,
     code:'import random\nparticipants = ["Анна", "Богдан", "Віктор", "Галина", "Дмитро", "Олена"]\nrandom.shuffle(participants)\nwinners = random.sample(participants, 3)\nprint("Учасників:", len(participants))\nprint("Переможці розіграшу:", winners)\n'},

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 3 — datetime, time, random, math",
  intro:`Тут ви відпрацьовуєте роботу з датами й часом (<code>datetime</code>, <code>time</code>), а далі — випадкові величини (<code>random</code>) і математику (<code>math</code>). Замість сухих прикладів ми спершу будуємо міні-планувальник подій (скільки днів до дедлайну, день тижня, формат дати), а потім проводимо розіграш призів (кубик, тасування, вибір переможців, вагові шанси). Запускайте код, міняйте значення, дописуйте самі.`,
  groups:[
    {name:"📅 Кейс · Дедлайни та події", desc:`Міні-планувальник на модулі <code>datetime</code>: поточна дата й атрибути, день тижня та форматування (<code>strftime</code>), різниця дат і зсув (<code>timedelta</code>), розбір дати з рядка (<code>strptime</code>). У фіналі — зведення по події.`, blocks:["dt-1","dt-2","dt-3","dt-4","dt-final"]},
    {name:"🎲 Кейс · Розіграш призів", desc:`Випадковість (<code>random</code>) і трохи математики (<code>math</code>): щасливе число (<code>randint</code>), тасування (<code>shuffle</code>), вибір переможців (<code>choice</code>, <code>sample</code>), вагові шанси (<code>choices</code>) і поділ призу з округленням (<code>math.floor</code>). Рандом живий — щоразу різне.`, blocks:["rnd-1","rnd-2","rnd-3","rnd-4","rnd-5","rnd-6","rnd-final"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки навколо округлення, чисел і дат та ідіоми форматування. Необов'язково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">🔒 Код виконується у вашому браузері — нічого не надсилається. Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
