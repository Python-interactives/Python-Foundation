<script>
const BLOCKS = {
  "ser-1": {title:"Що таке серіалізація", items:[
    {type:"note", text:`<b>🧊 Серіалізація</b> — перетворення обʼєкта (словника, списку, екземпляра класу…) на <b>потік байтів</b>, щоб зберегти його у файл, передати мережею чи покласти в базу. Зворотний процес — відновлення обʼєкта — це <b>десеріалізація</b>. Найпростіший приклад: зберегти дані у текстовий файл за власним «протоколом» і зчитати назад.`},
    {type:"run",
     prompt:`«Саморобна» серіалізація словника витрат у текстовий файл (пари <code>ключ|значення</code>) і зчитування назад у словник. Запустіть.`,
     code:'expenses = {"hotel": 150, "breakfast": 30, "taxi": 15}\n\nwith open("expenses.txt", "w") as fh:\n    for key, value in expenses.items():\n        fh.write(f"{key}|{value}\\n")\n\nloaded = {}\nwith open("expenses.txt", "r") as fh:\n    for line in fh.readlines():\n        key, value = line.split("|")\n        loaded[key] = int(value)\n\nprint(loaded)\n'},
    {type:"mcq", q:`Навіщо брати стандартний протокол (<code>pickle</code>, <code>json</code>) замість власного формату?`,
     opts:["готове й протестоване рішення — не треба вигадувати й памʼятати свій формат","стандартний формат завжди менший за розміром","власний протокол у Python неможливий"], answer:"готове й протестоване рішення — не треба вигадувати й памʼятати свій формат",
     expl:`У саморобному прикладі довелось вигадати правила (роздільник <code>|</code>, перетворення на <code>int</code>) і памʼятати про них. Стандартні протоколи знімають цей клопіт.`}
  ]},

  "pk-1": {title:"pickle · крок 1 (dumps / loads)", items:[
    {type:"note", text:`<b>🥒 <code>pickle</code></b> серіалізує обʼєкти Python у <b>байти</b> й назад — швидко, компактно, з підтримкою складних типів. Пара <code>dumps</code>/<code>loads</code> працює <b>у памʼяті</b> (байтовий рядок): зручно, коли байти треба, наприклад, відправити мережею. <code>dumps</code> — «в байти», <code>loads</code> — «з байтів».`},
    {type:"run",
     prompt:`Словник → байти → назад. Дивіться на тип та рівність відновленого. Запустіть.`,
     code:'import pickle\n\nmy_data = {"key": "value", "num": 42}\nserialized = pickle.dumps(my_data)\nprint("тип:", type(serialized).__name__)\nrestored = pickle.loads(serialized)\nprint(restored)\nprint("рівні?", restored == my_data)\n'},
    {type:"task",
     prompt:`Розпакуйте байти назад у словник і виведіть значення ключа <code>"num"</code>. Допишіть <code>print(restored["num"])</code>. Має вийти <code>42</code>.`,
     starter:'import pickle\n\ndata = {"a": 1, "num": 42}\nblob = pickle.dumps(data)\nrestored = pickle.loads(blob)\n# виведіть значення ключа "num"\n',
     expected:"42"}
  ]},

  "pk-2": {title:"pickle · крок 2 (dump / load у файл, класи)", items:[
    {type:"note", text:`Пара <code>dump</code>/<code>load</code> працює <b>з файлом</b> напряму (режими <code>"wb"</code>/<code>"rb"</code> — байти). Важливо: <code>pickle</code> зберігає <b>стан</b> обʼєкта, але <b>не сам клас</b>. Тому при <code>load</code> клас має бути вже оголошений у цьому скрипті — інакше помилка.`},
    {type:"run",
     prompt:`Зберігаємо екземпляр <code>Human</code> у файл і зчитуємо назад (клас оголошено тут-таки). Запустіть.`,
     code:'import pickle\n\nclass Human:\n    def __init__(self, name):\n        self.name = name\n\nwith open("human.pickle", "wb") as f:\n    pickle.dump(Human("Bob"), f)\n\nwith open("human.pickle", "rb") as f:\n    loaded = pickle.load(f)\n\nprint(loaded.name)\n'},
    {type:"task",
     prompt:`Збережіть налаштування у файл і зчитайте назад. Виведіть значення ключа <code>"theme"</code>: допишіть <code>print(loaded["theme"])</code>. Має вийти <code>dark</code>.`,
     starter:'import pickle\n\nsettings = {"theme": "dark", "language": "ukrainian"}\nwith open("settings.pickle", "wb") as f:\n    pickle.dump(settings, f)\n\nwith open("settings.pickle", "rb") as f:\n    loaded = pickle.load(f)\n\n# виведіть значення ключа "theme"\n',
     expected:"dark"},
    {type:"mcq", q:`Що станеться при <code>pickle.load</code>, якщо клас обʼєкта не оголошено в скрипті десеріалізації?`,
     opts:["помилка (AttributeError) — клас має бути визначений","обʼєкт завантажиться без класу","pickle сам відновить клас"], answer:"помилка (AttributeError) — клас має бути визначений",
     expl:`<code>pickle</code> зберігає лише стан, а не код класу. Клас (з тією ж структурою) має бути доступний там, де відбувається <code>load</code>.`}
  ]},

  "js-1": {title:"JSON · крок 1 (dumps / loads, типи)", items:[
    {type:"note", text:`<b>🔤 JSON</b> — текстовий формат обміну даними (читабельний людиною, підтримується багатьма мовами). <code>json.dumps</code> перетворює обʼєкт на <b>рядок JSON</b>, <code>json.loads</code> — назад. Але типи збігаються не повністю: кортеж і список → <b>масив</b>, ключ-число → <b>рядок</b>, <code>None</code> → <code>null</code>, <code>True</code>/<code>False</code> → <code>true</code>/<code>false</code>.`},
    {type:"run",
     prompt:`Помітьте два перетворення: кортеж стає масивом, а ключ-число <code>2</code> — рядком <code>"2"</code>. Запустіть.`,
     code:'import json\n\ndata = {"key": "value", 2: [1, 2, 3], "my_tuple": (5, 6)}\ns = json.dumps(data)\nprint(s)\nback = json.loads(s)\nprint(back)\nprint("тип my_tuple:", type(back["my_tuple"]).__name__)\n'},
    {type:"task",
     prompt:`Кортеж після JSON round-trip перетворюється на список. Виведіть тип значення ключа <code>"nums"</code> у відновленому обʼєкті: допишіть <code>print(type(back["nums"]).__name__)</code>. Має вийти <code>list</code>.`,
     starter:'import json\n\noriginal = {"nums": (10, 20, 30)}\ns = json.dumps(original)\nback = json.loads(s)\n# виведіть тип значення ключа "nums" (буде list)\n',
     expected:"list"},
    {type:"mcq", q:`На що перетворюється <b>кортеж</b> Python при <code>json.dumps</code>?`,
     opts:["на масив JSON (після loads — list)","залишається кортежем","на рядок"], answer:"на масив JSON (після loads — list)",
     expl:`JSON не розрізняє список і кортеж — обидва стають масивом. Тому <code>(5, 6)</code> після round-trip стане <code>[5, 6]</code>.`}
  ]},

  "js-2": {title:"JSON · крок 2 (файл, кирилиця)", items:[
    {type:"note", text:`<code>json.dump</code>/<code>json.load</code> пишуть і читають JSON <b>у файл</b>. Пастка з кирилицею: за замовчуванням не-ASCII символи стають escape-послідовностями <code>\\uXXXX</code>. Щоб зберегти читабельно — <code>ensure_ascii=False</code>, а <code>indent=4</code> додає відступи для зручності.`},
    {type:"run",
     prompt:`Порівняйте стандартний вивід (escape) і <code>ensure_ascii=False</code>. Запустіть.`,
     code:'import json\n\ndata = {"name": "Іван", "age": 30}\nprint("стандартно:")\nprint(json.dumps(data))\nprint("ensure_ascii=False:")\nprint(json.dumps(data, ensure_ascii=False))\n'},
    {type:"task",
     prompt:`Запишіть словник у файл (кирилиця збережеться завдяки <code>ensure_ascii=False</code>) і зчитайте назад. Виведіть значення ключа <code>"city"</code>: допишіть <code>print(loaded["city"])</code>. Має вийти <code>Київ</code>.`,
     starter:'import json\n\ndata = {"city": "Київ", "year": 2024}\nwith open("city.json", "w", encoding="utf-8") as f:\n    json.dump(data, f, ensure_ascii=False)\n\nwith open("city.json", "r", encoding="utf-8") as f:\n    loaded = json.load(f)\n\n# виведіть значення ключа "city"\n',
     expected:"Київ"}
  ]},

  "csv-1": {title:"CSV · крок 1 (reader / writer)", items:[
    {type:"note", text:`<b>📊 CSV</b> (Comma-Separated Values) — простий текстовий формат таблиць: рядок = запис, поля розділені комою; перший рядок часто заголовки. Модуль <code>csv</code>: <code>writer.writerows(...)</code> пише, <code>csv.reader(...)</code> ітерує рядки (кожен рядок — <b>список рядків-значень</b>). Файл відкривають із <code>newline=""</code>.`},
    {type:"run",
     prompt:`Записуємо таблицю, потім читаємо назад построково. Запустіть.`,
     code:'import csv\n\nrows = [["name", "age"], ["Vasyl", 30], ["Maria", 22]]\nwith open("data.csv", "w", newline="", encoding="utf-8") as f:\n    writer = csv.writer(f)\n    writer.writerows(rows)\n\nwith open("data.csv", newline="", encoding="utf-8") as f:\n    reader = csv.reader(f)\n    for row in reader:\n        print(", ".join(row))\n'},
    {type:"task",
     prompt:`Скільки всього рядків у файлі (разом із заголовком)? Прочитайте все у список і допишіть <code>print(len(data))</code>. Має вийти <code>3</code>.`,
     starter:'import csv\n\nrows = [["fruit", "count"], ["apple", 5], ["pear", 8]]\nwith open("fruits.csv", "w", newline="", encoding="utf-8") as f:\n    csv.writer(f).writerows(rows)\n\nwith open("fruits.csv", newline="", encoding="utf-8") as f:\n    data = list(csv.reader(f))\n\n# скільки всього рядків у файлі?\n',
     expected:"3"},

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
</script>
<script>
(function(){
  var f=document.querySelector(".snakeprog .fill"); if(!f) return;
  var h=document.documentElement;
  function upd(){
    var se=h.scrollHeight-h.clientHeight;
    var p=se>0?(h.scrollTop||document.body.scrollTop)/se:0;
    if(p<0)p=0; if(p>1)p=1;
    f.style.width=(p*100).toFixed(2)+"%";
  }
  addEventListener("scroll",upd,{passive:true});
  addEventListener("resize",upd);
  setTimeout(upd,60); setTimeout(upd,700); upd();
})();
</script>
<script>(function(){var b=document.getElementById("themeToggle"),r=document.documentElement;if(b)b.addEventListener("click",function(){var n=r.getAttribute("data-theme")==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("pf-theme",n);}catch(e){}});})();</script>
