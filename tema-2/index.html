<script>
const BLOCKS = {
  "mod-1": {title:"Модерація коментарів · крок 1 (умовні конструкції)", items:[
    {type:"note", text:`<b>🛡️ Будуємо систему модерації коментарів.</b> Тут тренуємо логіку: рішення, цикли й обробку помилок. Збиратимемо по шматочку через усю тему.<br><br><b>З теми:</b> <code>if / elif / else</code> виконує різний код залежно від умови, а <code>in</code> перевіряє, чи є слово в рядку.`},
    {type:"run",
     prompt:`Найпростіша модерація: якщо в коментарі є заборонене слово — блокуємо. Запустіть; підставте у <code>comment</code> інший текст (зі «спам» і без) і подивіться на рішення.`,
     code:'comment = "терміново купуй, це спам"\nif "спам" in comment:\n    print("заблоковано")\nelse:\n    print("пропущено")\n'},
    {type:"task",
     prompt:`Мета — щоб <b>порожні</b> коментарі позначались як <code>порожній</code>. У коді нижче замість <code>______</code> впишіть умову <code>comment == ""</code> (читається «коментар дорівнює порожньому рядку»). Очікуваний вивід: <code>порожній</code>.`,
     starter:'comment = ""\nif "спам" in comment:\n    print("заблоковано")\nelif ______:          # ← впишіть умову: коментар порожній\n    print("порожній")\nelse:\n    print("пропущено")\n',
     expected:"порожній"}
  ]},

  "mod-2": {title:"Модерація коментарів · крок 2 (цикл for)", items:[
    {type:"note", text:`<b>З теми.</b> Цикл <code>for</code> повторює дію для кожного елемента списку — тож можна перевірити не один коментар, а одразу всі.`},
    {type:"mcq", code:"total = 0\nfor n in [1, 2, 3]:\n    total += n\nprint(total)", opts:["6","3","123"], answer:"6", expl:`Цикл додає кожен елемент: 1+2+3=6.`},
    {type:"run",
     prompt:`Тепер модеруємо цілий список коментарів — цикл проходить кожен і виводить рішення. Запустіть; додайте свій коментар у список і подивіться.`,
     code:'comments = ["все чудово", "це спам", "дякую"]\nfor comment in comments:\n    if "спам" in comment:\n        print("заблоковано:", comment)\n    else:\n        print("ок:", comment)\n'},
    {type:"task",
     prompt:`Мета — порахувати заблоковані коментарі (має бути <code>2</code>). Усередині <code>if</code> замість <code>______</code> впишіть <code>blocked += 1</code> — так лічильник збільшують на одиницю.`,
     starter:'comments = ["це спам", "все ок", "спам знову", "дякую"]\nblocked = 0\nfor comment in comments:\n    if "спам" in comment:\n        ______            # ← збільште blocked на 1\nprint(blocked)\n',
     expected:"2"}
  ]},

  "mod-3": {title:"Модерація коментарів · крок 3 (обробка помилок)", items:[
    {type:"note", text:`<b>З теми.</b> Реальні дані бувають «биті» — наприклад, замість тексту трапляється <code>None</code>. Тоді код падає. Щоб помилка не зупиняла всю програму, її загортають у <code>try / except</code>. Ловити варто <b>конкретну</b> помилку (<code>except TypeError</code>), а не все підряд — інакше можна тихо проковтнути справжній баг.`},
    {type:"run",
     prompt:`Запустіть — і побачите проблему: на записі <code>None</code> програма падає з помилкою <code>TypeError</code> (у <code>None</code> не можна шукати слово).`,
     code:'comments = ["все ок", None, "це спам"]\nfor comment in comments:\n    if "спам" in comment:\n        print("заблоковано")\n    else:\n        print("ок")\n'},
    {type:"run",
     prompt:`А тепер те саме, але перевірка загорнута в <code>try / except</code>: битий запис просто пропускається, і програма доходить до кінця. Запустіть і порівняйте.`,
     code:'comments = ["все ок", None, "це спам"]\nfor comment in comments:\n    try:\n        if "спам" in comment:\n            print("заблоковано")\n        else:\n            print("ок")\n    except TypeError:\n        pass\n'}
  ]},

  "mod-final": {title:"Модерація коментарів · фінал", items:[
    {type:"note", text:`<b>Збираємо все докупи.</b> Модератор проходить усі коментарі циклом, пропускає биті записи через <code>try/except</code>, рахує заблоковані й виводить підсумок.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — система обробить увесь список. Додайте свій коментар (зі «спам» і без) у список і подивіться, як зміниться підсумок. 🛡️`,
     code:'comments = ["все ок", None, "це спам", "дякую", "спам тут"]\nblocked = 0\nfor comment in comments:\n    try:\n        if "спам" in comment:\n            blocked += 1\n    except TypeError:\n        pass\nprint(f"Перевірено {len(comments)} коментарів, заблоковано {blocked}")\n'}
  ]},

  "fn-1": {title:"Автоперевірка тесту · крок 1 (функція)", items:[
    {type:"note", text:`<b>🎯 Пишемо автоперевірку тесту.</b> <b>Функція</b> — це багаторазовий іменований блок коду: <code>def назва(аргументи):</code>, усередині — код, а <code>return</code> повертає результат назовні.`},
    {type:"run",
     prompt:`Функція <code>grade</code> за балом каже «склав» чи «не склав». Оголошуємо один раз — викликаємо скільки треба. Запустіть.`,
     code:'def grade(score):\n    if score >= 60:\n        return "склав"\n    else:\n        return "не склав"\n\nprint(grade(75))\nprint(grade(40))\n'},
    {type:"task",
     prompt:`Викличте функцію для бала <code>55</code>. Допишіть рядок <code>print(grade(55))</code>. Має вийти <code>не склав</code>.`,
     starter:'def grade(score):\n    if score >= 60:\n        return "склав"\n    else:\n        return "не склав"\n\n# допишіть рядок, що виведе оцінку для бала 55\n',
     expected:"не склав"}
  ]},

  "fn-2": {title:"Автоперевірка тесту · крок 2 (функція + цикл)", items:[
    {type:"note", text:`<b>З теми.</b> Оголошену функцію можна викликати скільки завгодно разів — наприклад, у циклі для кожного бала зі списку.`},
    {type:"run",
     prompt:`Прожене всі бали через <code>grade</code> й покаже оцінку кожного. Запустіть.`,
     code:'def grade(score):\n    return "склав" if score >= 60 else "не склав"\n\nscores = [75, 40, 90]\nfor s in scores:\n    print(s, "-", grade(s))\n'},
    {type:"task",
     prompt:`Порахуйте, скільки студентів склали. Усередині <code>if</code> замість <code>______</code> впишіть <code>passed += 1</code>. Має вийти <code>2</code>.`,
     starter:'def grade(score):\n    return "склав" if score >= 60 else "не склав"\n\nscores = [75, 40, 90, 55]\npassed = 0\nfor s in scores:\n    if grade(s) == "склав":\n        ______\nprint(passed)\n',
     expected:"2"}
  ]},

  "fn-3": {title:"Автоперевірка тесту · крок 3 (аргумент за замовчуванням)", items:[
    {type:"note", text:`<b>З теми.</b> Аргумент може мати значення <b>за замовчуванням</b>: <code>def grade(score, threshold=60)</code>. Тоді <code>grade(70)</code> візьме поріг 60, а <code>grade(70, 80)</code> — вкаже свій.`},
    {type:"mcq", code:"def add(a, b=10):\n    return a + b\nprint(add(5))", opts:["15","5","510"], answer:"15", expl:`b має значення за замовчуванням 10, тож add(5)=5+10.`},
    {type:"run",
     prompt:`Той самий бал, але різні пороги проходження. Запустіть.`,
     code:'def grade(score, threshold=60):\n    return "склав" if score >= threshold else "не склав"\n\nprint(grade(70))\nprint(grade(70, 80))\n'},
    {type:"task",
     prompt:`Перевірте бал <code>85</code> з підвищеним порогом <code>90</code>. Допишіть рядок <code>print(grade(85, 90))</code>. Має вийти <code>не склав</code>.`,
     starter:'def grade(score, threshold=60):\n    return "склав" if score >= threshold else "не склав"\n\n# допишіть рядок: бал 85, поріг 90\n',
     expected:"не склав"}
  ]},

  "fn-4": {title:"Автоперевірка тесту · крок 4 (будь-скільки аргументів)", items:[
    {type:"note", text:`<b>З теми.</b> <code>*args</code> дозволяє передати <b>будь-яку кількість</b> аргументів — усередині функції вони стають кортежем, який можна, наприклад, підсумувати.`},
    {type:"run",
     prompt:`Функція <code>average</code> рахує середнє з будь-якої кількості балів. Запустіть.`,
     code:'def average(*scores):\n    return sum(scores) / len(scores)\n\nprint(average(70, 80, 90))\nprint(average(50, 60))\n'},
    {type:"task",
     prompt:`Порахуйте середнє чотирьох балів. Допишіть рядок <code>print(average(60, 70, 80, 90))</code>. Має вийти <code>75.0</code>.`,
     starter:'def average(*scores):\n    return sum(scores) / len(scores)\n\n# допишіть рядок: середнє з 60, 70, 80, 90\n',
     expected:"75.0"}
  ]},

  "fn-final": {title:"Автоперевірка тесту · фінал", items:[
    {type:"note", text:`<b>Звіт по групі.</b> Дві функції разом: <code>grade</code> ставить оцінку кожному, <code>average</code> рахує середній бал.<br><br>🔗 <b>У фінальному проєкті</b> ви так само розкладете логіку на функції (додати контакт, знайти, видалити) — це основа всієї програми.`},
    {type:"run",
     prompt:`Натисніть «Запустити» — ось звіт по групі. Додайте студента у <code>students</code> й запустіть ще раз. 🎯`,

/* ================= утиліти ================= */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function elCard(){const d=document.createElement("div");d.className="card";return d;}

/* ===== Pyodide (лазі, лише для запуску коду) ===== */
let pyodide=null, pyLoading=null;
const PY_BASES=["https://cdn.jsdelivr.net/pyodide/v0.26.2/full/","https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("скрипт не завантажився: "+src));document.head.appendChild(s);});}
async function ensurePy(statusEl){
  if(pyodide) return pyodide;
  if(!pyLoading){
    pyLoading=(async()=>{
      let last;
      for(const base of PY_BASES){
        try{
          if(statusEl) statusEl.textContent="⏳ Завантажую Python…";
          if(typeof loadPyodide==="undefined") await loadScript(base+"pyodide.js");
          pyodide=await loadPyodide({indexURL:base});
          if(statusEl) statusEl.textContent="";
          return pyodide;
        }catch(e){ last=e; }
      }
      throw last||new Error("невідома помилка");
    })().catch(e=>{pyLoading=null; if(statusEl) statusEl.textContent=""; throw e;});
  }
  return pyLoading;
}
async function runCapture(py, code){
  const ind=code.split("\n").map(l=>"    "+l).join("\n");
  const prog="import sys, io\n_b=io.StringIO()\n_o=sys.stdout\nsys.stdout=_b\ntry:\n"+ind+"\nfinally:\n    sys.stdout=_o\n_b.getvalue()";
  return String(await py.runPythonAsync(prog));
}
function outputsMatch(a,b){
  const ta=a.trim().split(/\s+/), tb=b.trim().split(/\s+/);
  if(ta.length!==tb.length) return false;
  for(let i=0;i<ta.length;i++){
    if(ta[i]===tb[i]) continue;
    const fa=parseFloat(ta[i]),fb=parseFloat(tb[i]);
    if(!isNaN(fa)&&!isNaN(fb)&&Math.abs(fa-fb)<1e-9) continue;
    return false;
  }
  return true;
}

/* ================= рендер ================= */
function renderNote(item){
  const c=elCard();
  c.style.background="var(--panel2)";
  c.innerHTML=`<div>${item.text}</div>`;
  return c;
}

function renderMCQ(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag q">що виведе?</span></div>`+
    (item.scenario?`<p class="muted" style="margin:0 0 6px">${item.scenario}</p>`:"")+
    (item.q?`<p style="margin:0 0 10px">${item.q}</p>`:(item.code?`<p style="margin:0 0 10px">Що виведе цей код?</p>`:""))+
    (item.code?`<pre>${esc(item.code)}</pre>`:"")+
    `<div class="opts"></div><div class="fb"></div>`;
  const opts=c.querySelector(".opts"), fb=c.querySelector(".fb");
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.onclick=()=>{
      const ok=o===item.answer;
      c.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
        if(x.textContent===item.answer)x.classList.add("correct");
        else if(x===b)x.classList.add("wrong");});
      fb.className="fb show "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✅ Правильно. ":"❌ Правильно: <code>"+esc(item.answer)+"</code>. ")+(item.expl||"");
    };
    opts.appendChild(b);
  });
  return c;
}

function renderClassify(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag g">класифікація</span></div><p style="margin:0 0 10px">${item.prompt}</p><div class="chips"></div><div class="row"><button class="btn">Перевірити</button></div><div class="fb"></div>`;
  const wrap=c.querySelector(".chips"), fb=c.querySelector(".fb");
  item.items.forEach((it,i)=>{
    const ch=document.createElement("button");ch.className="chip";ch.textContent=it.label;ch.dataset.i=i;
    ch.onclick=()=>ch.classList.toggle("sel");
    wrap.appendChild(ch);
  });
  c.querySelector(".btn").onclick=()=>{
    let allOk=true; const notes=[];
    wrap.querySelectorAll(".chip").forEach(ch=>{
      const it=item.items[+ch.dataset.i];
      const sel=ch.classList.contains("sel");
      ch.classList.remove("sel");
      const right=sel===it.correct;
      ch.classList.add(right?"ok":"bad");
      if(!right) allOk=false;
      if(it.note) notes.push(`${it.label}: ${it.note}`);
    });
    fb.className="fb show "+(allOk?"ok":"no");
    fb.innerHTML=(allOk?"✅ Усе правильно!":"❌ Є неточності — дивіться підсвічене.")+(notes.length?"\n\n"+notes.map(esc).join("\n"):"");
  };
  return c;
}

function renderRun(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">спробуйте</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.code)}</textarea>`+
    `<div class="row"><button class="btn">▶ Запустити</button><span class="muted st"></span></div><div class="out"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; let py;
    try{py=await ensurePy(st);}catch(e){out.innerHTML='<span style="color:var(--red)">Не вдалося завантажити Python (потрібен інтернет).</span>';return;}
    try{const r=await runCapture(py, ta.value); out.innerHTML='<span class="muted">Результат у терміналі:</span>\n'+esc(r||"(нічого не виведено)");}
    catch(e){out.innerHTML='<span style="color:var(--red)">⚠️ '+esc(String(e.message||e).split("\n").slice(-3).join("\n"))+'</span>';}
  };
  return c;
}

function renderTask(item){
  const c=elCard();
  c.innerHTML=`<div class="meta"><span class="tag c">ваша черга</span></div>`+
    `<p style="margin:0 0 10px">${item.prompt}</p>`+
    `<textarea spellcheck="false">${esc(item.starter)}</textarea>`+
    `<div class="row"><button class="btn">Запустити й перевірити</button><span class="muted st"></span></div><div class="out"></div><div class="fb"></div>`;
  const ta=c.querySelector("textarea"), out=c.querySelector(".out"), fb=c.querySelector(".fb"), st=c.querySelector(".st");
  c.querySelector(".btn").onclick=async()=>{
    out.textContent=""; fb.className="fb"; let py;
    try{py=await ensurePy(st);}catch(e){fb.className="fb show no";fb.textContent="Не вдалося завантажити Python (потрібен інтернет).";return;}
    let got;
    try{got=(await runCapture(py, ta.value)).trim();}
    catch(e){fb.className="fb show no";fb.innerHTML="⚠️ Помилка: "+esc(String(e.message||e).split("\n").slice(-2).join("\n"));return;}
    out.innerHTML='<span class="muted">Вивід:</span>\n'+esc(got||"(нічого)");
    if(outputsMatch(got, item.expected)){fb.className="fb show ok";fb.innerHTML="✅ Правильно!";}
    else{fb.className="fb show no";fb.innerHTML="❌ Поки не те. Очікувалося:\n"+esc(item.expected);}
  };
  return c;
}

function renderDiagnostic(item){
  const c=elCard();
  const total=item.questions.length;
  c.innerHTML=`<div class="meta"><span class="tag q">перевір себе</span></div>`+
    (item.intro?`<p style="margin:0 0 14px">${item.intro}</p>`:"")+
    `<div class="dq"></div><div class="fb"></div>`;
  const wrap=c.querySelector(".dq"), fb=c.querySelector(".fb");
  const wrong=[]; let answered=0;
  item.questions.forEach(q=>{
    const qd=document.createElement("div");
    qd.style.margin="0 0 18px";
    qd.innerHTML=(q.scenario?`<p class="muted" style="margin:0 0 6px">${esc(q.scenario)}</p>`:"")+
      (q.q?`<p style="margin:0 0 8px">${q.q}</p>`:(q.code?`<p style="margin:0 0 8px">Що виведе цей код?</p>`:""))+
      (q.code?`<pre>${esc(q.code)}</pre>`:"")+
      `<div class="opts"></div>`;
    const opts=qd.querySelector(".opts");
    shuffle(q.opts).forEach(o=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{
        const ok=o===q.answer;
        opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true;
          if(x.textContent===q.answer)x.classList.add("correct");
          else if(x===b)x.classList.add("wrong");});
        if(!ok && wrong.indexOf(q.section)===-1) wrong.push(q.section);
        answered++;
        if(answered===total){
          if(wrong.length===0){
            fb.className="fb show ok";
            fb.innerHTML="✅ Усе правильно — тему тримаєте впевнено, можна рухатись далі.";
          }else{
            fb.className="fb show no";
            fb.innerHTML="Варто повторити ці розділи конспекту:\n— "+wrong.join("\n— ");
          }
        }
      };
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return c;
}

function renderItem(item){
  if(item.type==="diagnostic") return renderDiagnostic(item);
  if(item.type==="note") return renderNote(item);
  if(item.type==="mcq") return renderMCQ(item);
  if(item.type==="classify") return renderClassify(item);
  if(item.type==="run") return renderRun(item);
  if(item.type==="task") return renderTask(item);
  const d=elCard();d.textContent="Невідомий тип: "+item.type;return d;
}

/* ================= орієнтир теми ================= */
const TOPIC = {
  title:"Тема 2 — керуючі конструкції, винятки, функції",
  intro:`Тут ви відпрацьовуєте логіку Python: рішення (<code>if</code>), цикли (<code>for</code>), обробку помилок (<code>try/except</code>) і функції (<code>def</code>). Спершу будуємо систему модерації коментарів, потім пишемо автоперевірку тесту на функціях. Запускайте код, міняйте його й дописуйте самі.`,
  groups:[
    {name:"🛡️ Кейс · Модерація коментарів", desc:`Будуємо модератор крок за кроком: рішення по одному коментарю (<code>if/elif/else</code>), цикл по всьому списку (<code>for</code>), лічильник заблокованих і обробка «битих» записів (<code>try/except</code>). У фіналі — усе разом.`, blocks:["mod-1","mod-2","mod-3","mod-final"]},
    {name:"🎯 Кейс · Автоперевірка тесту (функції)", desc:`Функції: оголошення (<code>def</code>, <code>return</code>), виклик у циклі, аргумент за замовчуванням, <code>*args</code> для будь-якої кількості аргументів. У фіналі — звіт по групі.`, blocks:["fn-1","fn-2","fn-3","fn-4","fn-final"]},
    {name:"⚡ Для впевнених", desc:`Якщо базове дається легко — пастки навколо функцій, циклів і винятків та ідіоми Python. Необов'язково.`, blocks:["experienced"]},
    {name:"✅ Перевір себе", desc:`Коротка діагностика по всій темі. Наприкінці підкаже, які розділи конспекту варто повторити.`, blocks:["review"]}
  ]
};
function findGroup(id){for(const g of TOPIC.groups){const i=g.blocks.indexOf(id);if(i!==-1)return{g,i};}return null;}

/* ================= ініціалізація ================= */
function renderIndex(){
  const app=document.getElementById("app");
  let html=`<div class="card"><h2 style="margin:0 0 8px;font-size:1.15rem">${esc(TOPIC.title)}</h2><p style="margin:0 0 10px">${TOPIC.intro}</p><p class="muted" style="margin:0">Проходьте по порядку: кожен крок додає щось нове.</p></div>`;
  TOPIC.groups.forEach(g=>{html+=`<div class="card"><strong>${g.name}</strong>${g.desc?`<p class="muted" style="margin:6px 0 10px">${g.desc}</p>`:""}<div class="idx"></div></div>`;});
  app.innerHTML=html;
  const idxs=app.querySelectorAll(".idx");
  TOPIC.groups.forEach((g,gi)=>{g.blocks.forEach(id=>{const b=BLOCKS[id];if(!b)return;const a=document.createElement("a");a.href="?block="+id;a.textContent=b.title;idxs[gi].appendChild(a);});});
}
function renderBlock(id){
  const b=BLOCKS[id];
  document.getElementById("title").innerHTML='🐍 '+esc(b.title);
  const app=document.getElementById("app");
  const gi=findGroup(id);
  if(gi){const c=document.createElement("div");c.className="card";c.innerHTML=`<div class="muted" style="font-size:.9rem">${gi.g.name} · крок ${gi.i+1} з ${gi.g.blocks.length}</div>`+((gi.i===0&&gi.g.desc)?`<p style="margin:8px 0 0">${gi.g.desc}</p>`:"");app.appendChild(c);}
  b.items.forEach(it=>app.appendChild(renderItem(it)));
  if(gi){const nav=document.createElement("div");nav.style.cssText="display:flex;gap:12px;margin:18px 0 4px;align-items:center";const g=gi.g,i=gi.i;if(i>0)nav.innerHTML+=`<a href="?block=${g.blocks[i-1]}">← попередній крок</a>`;if(i<g.blocks.length-1)nav.innerHTML+=`<a href="?block=${g.blocks[i+1]}" style="margin-left:auto">наступний крок →</a>`;if(nav.children.length)app.appendChild(nav);}
  const back=document.createElement("p");back.innerHTML='<a href="?">← усі інтерактиви теми</a>';back.className="muted";
  app.appendChild(back);
}

const params=new URLSearchParams(location.search);
const blockId=params.get("block");
if(blockId && BLOCKS[blockId]) renderBlock(blockId);
else renderIndex();
